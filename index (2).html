n từ.`,type:`matching`,pairs:[{id:`p6`,term:`Sản xuất điện năng`,description:`Biến đổi các dạng năng lượng nước, gió, mặt trời, hạt nhân thành điện năng`,iconName:`Zap`},{id:`p7`,term:`Công nghệ Điện - Quang`,description:`Biến đổi điện năng thành quang năng (đèn sợi đốt 1879, huỳnh quang 1934, đèn LED 2006)`,iconName:`Lightbulb`},{id:`p8`,term:`Công nghệ Điện - Cơ`,description:`Biến điện năng thành cơ năng: dạng quay (quạt, máy bơm) hoặc tịnh tiến (rơ le, van từ)`,iconName:`Cog`},{id:`p9`,term:`Điều khiển & Tự động hoá`,description:`Vận hành các dây chuyền sản xuất tự động, thay thế thao tác con người, giảm chi phí`,iconName:`Cpu`},{id:`p10`,term:`Truyền thông không dây`,description:`Truyền tải thông tin qua sóng điện từ không cần dây dẫn (Wi-Fi, Bluetooth, mạng di động)`,iconName:`Radio`}]},{id:`m-b4-s1`,lessonId:`bai-4`,title:`Ghép đôi Công nghệ Mới (Bộ 1 - Công nghệ Tiên phong)`,explanation:`Bài 4 SGK: Công nghệ nano (1-100 nm); CAD/CAM/CNC kết nối thiết kế đến máy gia công số; In 3D đắp chồng từng lớp vật liệu 2D.`,type:`matching`,pairs:[{id:`p11`,term:`Công nghệ Nano`,description:`Vật liệu kích thước siêu nhỏ từ 1 đến 100 nm (nano bạc diệt khuẩn, thuốc tiêu diệt ung thư)`,iconName:`Atom`},{id:`p12`,term:`Công nghệ CAD/CAM/CNC`,description:`Thiết kế máy tính (CAD) chuyển sang quy trình gia công (CAM) và máy số thực thi (CNC)`,iconName:`Monitor`},{id:`p13`,term:`Công nghệ in 3D`,description:`Phân tách mô hình 3D thành các lớp 2D xếp chồng lên nhau, đắp dần vật liệu tuần tự`,iconName:`Layers`},{id:`p14`,term:`Năng lượng tái tạo`,description:`Khai thác nguồn năng lượng vô hạn, ít gây ô nhiễm (năng lượng mặt trời, gió, địa nhiệt)`,iconName:`Sun`}]},{id:`m-b4-s2`,lessonId:`bai-4`,title:`Ghép đôi Công nghệ Mới (Bộ 2 - Trí tuệ số & Kết nối)`,explanation:`Bài 4 SGK: AI mô phỏng trí tuệ con người; IoT kết nối vạn vật qua internet do Kevin Ashton đưa ra năm 1999; Robot thông minh có bộ não AI nhận thức môi trường.`,type:`matching`,pairs:[{id:`p15`,term:`Trí tuệ nhân tạo ( n phẩm & Ứng dụng thực tiễn)`,explanation:`Tổng hợp SGK: Hạt nano bạc kháng khuẩn; Đèn LED tiết kiệm điện năng; Bộ PLC điều khiển công nghiệp; Rơ le biến đổi điện - cơ tịnh tiến.`,type:`matching`,pairs:[{id:`p31`,term:`Hạt Nano bạc`,description:`Khả năng tiêu diệt vi khuẩn được tích hợp vào sợi vải dệt may và khẩu trang y tế`,iconName:`Shield`},{id:`p32`,term:`Rơ le điện từ`,description:`Thiết bị điện - cơ dạng tịnh tiến dùng tín hiệu điện nhỏ điều khiển mạch điện lớn`,iconName:`ToggleRight`},{id:`p33`,term:`Bộ điều khiển PLC`,description:`Sáng chế của General Motors năm 1968 đưa tự động hóa sản xuất lên tầm cao mới`,iconName:`Cpu`},{id:`p34`,term:`Đèn phát quang LED`,description:`Chuyển trực tiếp dòng điện một chiều qua diode thành quang năng, hiệu suất rất cao`,iconName:`Sun`}]}],b=[{id:`dd-b3-s1`,lessonId:`bai-3`,title:`Kéo thả: Phương pháp gia công cơ khí (Bộ 1)`,explanation:`Bài 3 SGK: Đúc là rót kim loại lỏng vào khuôn; Cắt gọt tạo phoi; Gia công áp lực dựa vào tính dẻo kim loại; Hàn nung chảy/ép tạo liên kết vĩnh cửu.`,type:`drag-drop`,instruction:`Kéo tên phương pháp công nghệ vào đúng bản chất kỹ thuật tương ứng:`,slots:[{id:`s1`,label:`Rót kim loại lỏng vào khuôn`,description:`Tạo sản phẩm/phôi có hình dạng kích thước theo lòng khuôn`},{id:`s2`,label:`Bóc tách kim loại tạo ra phoi`,description:`Sử dụng dao tiện, phay, bào, mài để tăng độ chính xác chi tiết`},{id:`s3`,label:`Tác dụng ngoại lực dựa vào tính dẻo`,description:`Cán, kéo, rèn, dập để định hình phôi mà không làm đứt gãy`},{id:`s4`,label:`Nung nóng liên kết không thể tháo rời`,description:`Gắn kết các chi tiết bằng cách nung đến trạng thái chảy hoặc dẻo`}],items:[{id:`i1`,text:`Công nghệ Đúc`,targetSlotId:`s1`},{id:`i2`,text:`Gia công Cắt gọt`,targetSlotId:`s2`},{id:`i3`,text:`Gia công Áp lực`,targetSlotId:`s3`},{id:`i4`,text:`Công nghệ Hàn`,targetSlotId:`s4`}]},{id:`dd-b3-s2`,lessonId:`bai-3`,title:`Kéo thả: Ứng dụng Điện - Cơ và Điện - Quang (Bộ 2)`,explanation:`Bài 3 SGK: Thiết bị chuyển động q s1`,lessonId:`tong-hop`,title:`Phân loại Tổng hợp: Công nghệ Truyền thống vs Công nghệ Hiện đại (Bộ 1)`,explanation:`Tổng hợp SGK: Công nghệ truyền thống chủ yếu cơ khí hóa và dùng năng lượng cơ bản (rèn, dập, đúc cát, hơi nước); Công nghệ hiện đại ứng dụng số hóa, tự động hóa, nano và AI.`,type:`classification`,instruction:`Phân loại các phương pháp công nghệ vào đúng nhóm phát triển:`,categories:[{id:`cat-trad`,name:`Công nghệ Cơ bản / Truyền thống`,color:`border-stone-500/40 bg-stone-500/10 text-stone-300`},{id:`cat-adv`,name:`Công nghệ Cao / Đột phá Hiện đại`,color:`border-teal-500/40 bg-teal-500/10 text-teal-300`}],items:[{id:`c37`,text:`Rèn thủ công bằng búa và đe`,categoryId:`cat-trad`,detailHint:`Gia công áp lực truyền thống`},{id:`c38`,text:`Đèn sợi đốt đốt nóng vonfram`,categoryId:`cat-trad`,detailHint:`Hiệu suất quang học thấp, tỏa nhiều nhiệt`},{id:`c39`,text:`Gia công chi tiết trên máy tiện cơ`,categoryId:`cat-trad`,detailHint:`Công nhân quay tay gạt cơ học`},{id:`c40`,text:`Cắt gọt phôi bằng chùm tia Laser CNC`,categoryId:`cat-adv`,detailHint:`Độ chính xác cực cao điều khiển bằng máy tính`},{id:`c41`,text:`In 3D vật thể sinh học cấy ghép`,categoryId:`cat-adv`,detailHint:`Đắp từng lớp tế bào hoặc titan siêu nhẹ`},{id:`c42`,text:`Hệ thống Robot thông minh nhận thức`,categoryId:`cat-adv`,detailHint:`Tự động né tránh vật cản và tối ưu thao tác`}]},{id:`cl-th-s2`,lessonId:`tong-hop`,title:`Phân loại Tổng hợp: Nguồn năng lượng trong sản xuất (Bộ 2)`,explanation:`Tổng hợp Bài 3 & 4: Nhiệt điện đốt than phát sinh khí thải; Thủy điện dùng thế năng nước; Điện gió & Mặt trời dùng năng lượng tái tạo; Hạt nhân phân hạch nguyên tử.`,type:`classification`,instruction:`Phân loại nguồn năng lượng đầu vào để tạo ra điện năng:`,categories:[{id:`cat-nat`,name:`Năng lượng Tự nhiên / Tái tạo`,color:`border-emerald-500/40 bg-emerald-500/10 text-emerald-300`},{id:`cat-conv`,name:`Năng lượng Nhiệt & Phản ứng hạt nhân`,color:`border-amber-500/40 bg-amber-500/10 text-amber-300`}],items:[{id:`c43`,text:`Thác nước đổ qua tua bin thủy điện`,categoryId:`cat-nat`,detailHint:`Cơ năng của dòng nước thiên nhiên`},{id:`c44`,text:`Quang năng từ ánh sáng Mặt trời`,categoryId:`cat-nat`,detailHint:`Tạo dòng điện một chiều trong pin mặt trời`},{id:`c45`,text:`Sức gió đẩy cánh quạt phong điện`,categoryId:`cat-nat`,detailHint:`Quay máy phát điện trên không`},{id:`c46`,text:`Nhiệt đốt cháy than đá đun sôi nước`,categoryId:`cat-conv`,detailHint:`Tạo hơi nước áp suất cao làm quay tuabin`},{id:`c47`,text:`Năng lượng phân hạch hạt nhân Uranium`,categoryId:`cat-conv`,detailHint:`Phản ứng tỏa nhiệt lượng khổng lồ`},{id:`c48`,text:`Khí gas thiên nhiên đốt buồng khí tuabin`,categoryId:`cat-conv`,detailHint:`Nhiệt điện tua bin khí chu trình hỗn hợp`}]}],S=[{id:`ord-b3-s1`,lessonId:`bai-3`,title:`Sắp xếp: Tiến trình phát triển Công nghệ Điện - Quang (Bộ 1)`,explanation:`Hình 3.9 SGK trang 20: Đèn sợi đốt phát minh năm 1879 -> Đèn phóng điện (huỳnh quang) năm 1934 -> Đèn LED năm 2006.`,type:`ordering`,instruction:`Kéo và sắp xếp các loại bóng đèn chiếu sáng theo đúng mốc thời gian xuất hiện trong lịch sử:`,steps:[{id:`s1`,text:`Bóng đèn sợi đốt (Năm 1879 - Thomas Edison)`,correctIndex:0,hint:`Dòng điện qua sợi đốt nung đỏ phát sáng`},{id:`s2`,text:`Bóng đèn phóng điện / huỳnh quang (Năm 1934)`,correctIndex:1,hint:`Phóng điện kích hoạt bột huỳnh quang phát sáng`},{id:`s3`,text:`Bóng đèn phát quang LED (Năm 2006)`,correctIndex:2,hint:`Đi-ốt phát quang bán dẫn hiện đại, tiết kiệm điện`}]},{id:`ord-b3-s2`,lessonId:`bai-3`,title:`Sắp xếp: Quy trình Công nghệ Đúc kim loại (Bộ 2)`,explanation:`Bài 3 mục 2 SGK: Chuẩn bị mẫu và khuôn đúc -> Nấu kim loại thành trạng thái lỏng -> Rót kim loại lỏng vào khuôn -> Để kim loại nguội và đông đặc -> Dỡ khuôn và làm sạch phôi đúc.`,type:`ordering`,instruction:`Sắp xếp các bước thực hiện đúng quy trình công nghệ đúc chi tiết kim loại:`,steps:[{id:`s4`,text:`Chế tạo mẫu và tạo lòng khuôn đúc chuẩn kích thước`,correctIndex:0,hint:`Chuẩn bị khuôn cát hoặc khuôn kim loại`},{id:`s5`,text:`Nung nóng kim loại nguyên liệu thành trạng thái lỏng`,correctIndex:1,hint:`Đưa vào lò nấu chảy ở nhiệt độ cao`},{id:`s6`,text:`Rót kim loại lỏng vào trong lòng khuôn`,correctIndex:2,hint:`Rót đều tay, tránh rỗ khí`},{id:`s7`,text:`Kim loại nguội dần và đông đặc theo hình dạng khuôn`,correctIndex:3,hint:`Chuyển từ pha lỏng sang pha rắn`},{id:`s8`,text:`Dỡ khuôn, cắt bỏ đậu ngót và làm sạch bề mặt phôi đúc`,correctIndex:4,hint:`Thu được vật đúc thô hoàn chỉnh`}]},{id:`ord-b4-s1`,lessonId:`bai-4`,title:`Sắp xếp: Chuỗi các bước thực hiện gia công CAD/CAM/CNC (Bộ 1)`,explanation:`Hình 4.3 SGK trang 24: Ý tưởng cho chi tiết -> Phần mềm CAD (Mô hình thiết kế trên máy tính) -> Phần mềm CAM (Quy trình công nghệ gia công trên máy tính) -> Máy CNC -> Chi tiết thực.`,type:`ordering`,instruction:`Sắp xếp 5 giai đoạn theo đúng sơ đồ khối quy trình CAD/CAM/CNC trong SGK:`,steps:[{id:`s9`,text:`Ý tưởng thiết kế ban đầu cho chi tiết`,correctIndex:0,hint:`Xác định hình dạng và kích thước mong muốn`},{id:`s10`,text:`Dùng phần mềm CAD dựng mô hình thiết kế 3D trên máy tính`,correctIndex:1,hint:`Computer Aided Design`},{id:`s11`,text:`Dùng phần mềm CAM lập quy trình công nghệ gia công`,correctIndex:2,hint:`Computer Aided Manufacturing`},{id:`s12`,text:`Chuyển chương trình điều khiển số sang máy CNC`,correctIndex:3,hint:`Computer Numerical Control`},{id:`s13`,text:`Máy CNC cắt gọt tự động hoàn thiện chi tiết thực`,correctIndex:4,hint:`Sản phẩm cơ khí chính xác ra đời`}]},{id:`ord-b4-s2`,lessonId:`bai-4`,title:`Sắp xếp: Nguyên lý tạo hình bằng Công nghệ In 3D (Bộ 2)`,explanation:`Bài 4 mục 3 SGK trang 25: Thiết kế mô hình 3D trên máy tính -> Phân tách mô hình 3D thành các lớp 2D liên tiếp -> Máy in nạp vật liệu và đắp từng lớp tuần tự xếp chồng lên nhau -> Hoàn thiện sản phẩm.`,type:`ordering`,instruction:`Sắp xếp theo thứ tự nguyên lý tạo hình của công nghệ in 3D (Additive Manufacturing):`,steps:[{id:`s14`,text:`Tạo dựng mô hình vật thể dạng 3 chiều (3D Model)`,correctIndex:0,hint:`Thiết kế kỹ thuật số trên phần mềm máy tính`},{id:`s15`,text:`Phần mềm cắt lớp phân tách mô hình 3D thành các lớp 2D siêu mỏng`,correctIndex:1,hint:`Quy trình Slicing tạo dữ liệu lát cắt`},{id:`s16`,text:`Đầu đùn/tia laser đắp dần lớp vật liệu đầu tiên lên bàn in`,correctIndex:2,hint:`Bắt đầu từ đáy vật thể`},{id:`s17`,text:`Lần lượt đắp các lớp 2D tiếp theo xếp chồng tuần tự lên nhau`,correctIndex:3,hint:`Các lớp kết dính chặt chẽ tạo thành khối`},{id:`s18`,text:`Tách sản phẩm khỏi bàn in và xử lý bề mặt nhẵn bóng`,correctIndex:4,hint:`Sản phẩm 3D hoàn chỉnh sẵn sàng sử dụng`}]},{id:`ord-b6-s1`,lessonId:`bai-6`,title:`Sắp xếp: Tiến trình 4 Cuộc Cách mạng Công nghiệp (Bộ 1)`,explanation:`Bài 6 SGK: Bước 1 (Động cơ hơi nước và Cơ giới hóa tại Anh) -> Bước 2 (Năng lượng điện và Dây chuyền sản xuất hàng loạt tại Anh, Đức, Hoa Kì) -> Bước 3 (Công nghệ thông tin, Máy tính điện tử và Tự động hóa tại Mỹ) -> Bước 4 (Công nghệ số, IoT, Big Data và AI tại Đức).`,type:`ordering`,instruction:`Sắp xếp các mốc thời gian & phát minh then chốt theo đúng trình tự lịch sử (Bước 1 đến Bước 4):`,steps:[{id:`s19`,text:`Động cơ hơi nước và Cơ giới hóa`,correctIndex:0,hint:`Tại nước Anh`},{id:`s20`,text:`Năng lượng điện và Dây chuyền sản xuất hàng loạt`,correctIndex:1,hint:`Tại nước Anh, Đức, Hoa Kì`},{id:`s21`,text:`Công nghệ thông tin, Máy tính điện tử và Tự động hóa`,correctIndex:2,hint:`Tại nước Mỹ`},{id:`s22`,text:`Công nghệ số, Internet vạn vật (IoT), Big Data và Trí tuệ AI`,correctIndex:3,hint:`Tại nước Đức`}]},{id:`ord-b6-s2`,lessonId:`bai-6`,title:`Sắp xếp: Trình tự thời gian các phát minh vĩ đại (Bộ 2)`,explanation:`Mục Thông tin bổ sung SGK trang 34-36: Henry Cort luyện cán thép (1783) -> James Watt động cơ hơi nước (1784) -> Edmund Cartwright máy dệt con thoi lò xo (1786) -> Robert Fulton tàu thủy hơi nước (1807) -> George Stephenson xe lửa hơi nước (1814).`,type:`ordering`,instruction:`Sắp xếp các sáng chế trong Cách mạng Công nghiệp lần thứ nhất theo thứ tự năm ra đời:`,steps:[{id:`s23`,text:`Năm 1783: Henry Cort sáng chế máy cán thép`,correctIndex:0,hint:`Cải tiến vượt bậc ngành luyện kim`},{id:`s24`,text:`Năm 1784: James Watt sáng chế động cơ hơi nước vạn năng`,correctIndex:1,hint:`Đột phá năng lượng cơ học`},{id:`s25`,text:`Năm 1786: Edmund Cartwright chế tạo máy dệt vải cải tiến`,correctIndex:2,hint:`Có con thoi chuyển động bằng lò xo`},{id:`s26`,text:`Năm 1807: Robert Fulton chế tạo tàu thuỷ chạy bằng hơi nước`,correctIndex:3,hint:`Cách mạng giao thông đường thuỷ`},{id:`s27`,text:`Năm 1814: George Stephenson phát minh đầu máy xe lửa hơi nước`,correctIndex:4,hint:`Cách mạng giao thông đường sắt`}]},{id:`ord-th-s1`,lessonId:`tong-hop`,title:`Sắp xếp Tổng hợp: Tiến hóa từ Sản xuất Thủ công đến Nhà máy Thông minh (Bộ 1)`,explanation:`Tổng hợp cả 3 bài: Lao động thủ công -> Máy chạy bằng hơi nước -> Dây chuyền điện khí hóa -> Tự động hóa bằng máy tính/PLC -> Nhà máy thông minh Smart Factory.`,type:`ordering`,instruction:`Sắp xếp các nấc thang phát triển của nền sản xuất loài người:`,steps:[{id:`s28`,text:`Nền sản xuất nông nghiệp nhỏ lẻ, dùng sức kéo động vật và cơ bắp người`,correctIndex:0,hint:`Thời kỳ tiền công nghiệp`},{id:`s29`,text:`Sử dụng động cơ hơi nước cơ giới hóa các xưởng dệt và mỏ than`,correctIndex:1,hint:`CMCN lần thứ nhất`},{id:`s30`,text:`Lắp ráp theo băng chuyền chuyên môn hóa chạy bằng động cơ điện`,correctIndex:2,hint:`CMCN lần thứ hai`},{id:`s31`,text:`Điều khiển máy móc bằng vi mạch máy tính và bộ lập trình PLC`,correctIndex:3,hint:`CMCN lần thứ ba`},{id:`s32`,text:`Nhà máy thông minh kết nối mạng cảm biến IoT và robot AI hoạt động 24/7`,correctIndex:4,hint:`CMCN lần thứ tư`}]},{id:`ord-th-s2`,lessonId:`tong-hop`,title:`Sắp xếp Tổng hợp: Mốc son của ngành Công nghệ Thông tin & Số hóa (Bộ 2)`,explanation:`Bài 6 SGK: ENIAC (1946) -> Transistor (1947) -> Máy tính cá nhân (1970) -> Internet (1990) -> Thuật ngữ Công nghiệp 4.0 tại Đức (2011).`,type:`ordering`,instruction:`Sắp xếp các mốc son công nghệ số theo trật tự thời gian chính xác:`,steps:[{id:`s33`,text:`Hoàn thành máy tính số điện tử đầu tiên ENIAC (1946)`,correctIndex:0,hint:`Khai sinh kỷ nguyên điện toán`},{id:`s34`,text:`Sáng chế bóng bán dẫn Transistor của Bardeen, Brattain, Shockley (1947)`,correctIndex:1,hint:`Nền tảng của vi mạch hiện đại`},{id:`s35`,text:`Máy tính cá nhân (PC) ra đời phục vụ người dùng (1970)`,correctIndex:2,hint:`Máy tính bước vào đời sống`},{id:`s36`,text:`Mạng Internet toàn cầu bắt đầu phổ cập thương mại (1990)`,correctIndex:3,hint:`Kết nối mạng máy tính thế giới`},{id:`s37`,text:`Thuật ngữ "Công nghiệp 4.0" lần đầu được sử dụng tại Đức (2011)`,correctIndex:4,hint:`Mở đầu cuộc CMCN 4.0`}]}],C=[{id:`eng-b3-s1-1`,lessonId:`bai-3`,title:`Tình huống 1: Chế tạo chi tiết trục máy phức tạp có rãnh then`,explanation:`Bài 3 mục 3 SGK trang 16: Công nghệ gia công cắt gọt (tiện, phay, bào, mài) giúp bóc tách kim loại tạo thành phoi để đạt độ chính xác kích thước và độ nhẵn bề mặt rất cao cho các chi tiết máy cơ khí.`,type:`engineer`,role:`Kỹ sư Chế tạo máy tại Nhà máy Cơ khí`,scenario:`Khách hàng đặt hàng chế tạo 500 trục truyền động cho động cơ xe tải. Yêu cầu kỹ thuật: độ đồng tâm cao, độ nhẵn bóng bề mặt cao và có rãnh then then hoa với độ chính xác đến từng micromet. Bạn sẽ chỉ đạo xưởng áp dụng công nghệ nào?`,options:[{id:`opt1`,text:`Sử dụng công nghệ Gia công cắt gọt (Tiện tròn chính xác kết hợp Phay rãnh then và Mài bóng)`,isCorrect:!0,engineerFeedback:`Chính xác! Gia công cắt gọt (tiện trục, phay rãnh, mài tinh) là giải pháp tối ưu nhất để đạt độ chính xác kích thước và độ bóng bề mặt cao theo yêu cầu khắt khe của chi tiết máy.`},{id:`opt2`,text:`Đúc khuôn cát và để nguyên bề mặt không cần qua gia công cơ khí`,isCorrect:!1,engineerFeedback:`Sai lầm kỹ thuật! Đúc khuôn cát có bề mặt nhám xơ, sai số kích thước lớn, không thể đáp ứng độ nhẵn và rãnh then chính xác của trục máy.`},{id:`opt3`,text:`Nung chảy kim loại rồi hàn nối các thanh thép rời lại với nhau`,isCorrect:!1,engineerFeedback:`Không khả thi! Mối hàn có ứng suất nhiệt dư, dễ bị cong vênh và nứt gãy khi chịu tải xoắn lớn của trục truyền động.`},{id:`opt4`,text:`Chỉ dùng phương pháp rèn tự do bằng tay để định hình trục`,isCorrect:!1,engineerFeedback:`Không phù hợp! Rèn tự do chỉ tạo phôi thô với sai số lớn, không thể tạo được rãnh then hoa tinh xảo và bề mặt nhẵn bóng.`}],realWorldImpact:`Ứng dụng trong ngành công nghiệp phụ trợ ô tô, đóng tàu và chế tạo máy bay.`},{id:`eng-b3-s1-2`,lessonId:`bai-3`,title:`Tình huống 2: Lựa chọn vật liệu và phương pháp cho vỏ động cơ máy bơm`,explanation:`Bài 3 mục 2 SGK trang 15: Công nghệ đúc kim loại chế tạo sản phẩm bằng cách rót kim loại lỏng vào khuôn. Đúc có thể tạo được các chi tiết có hình dạng phức tạp như thân máy công cụ, vỏ động cơ,... mà gia công cắt gọt rất khó hoặc tốn kém.`,type:`engineer`,role:`Kỹ sư Trưởng Xưởng Đúc kim loại`,scenario:`Xưởng cần sản xuất hàng loạt vỏ máy bơm nước công nghiệp có các khoang chứa nước, cánh tản nhiệt phức tạp và thành vỏ uốn lượn. Phương án nào tối ưu nhất về chi phí và tính khả thi?`,options:[{id:`opt1`,text:`Đúc kim loại (dùng khuôn kim loại hoặc khuôn cát tạo hình liền khối)`,isCorrect:!0,engineerFeedback:`Xuất sắc! Vỏ động cơ máy bơm có các khoang rỗng và cánh tản nhiệt phức tạp nên phương pháp đúc kim loại là giải pháp kinh tế và nhanh nhất để tạo hình sản phẩm nguyên khối.`},{id:`opt2`,text:`Dùng máy phay gọt từ một khối kim loại đặc nguyên khối hình lập phương`,isCorrect:!1,engineerFeedback:`Quá lãng phí! Phay từ phôi đặc sẽ tạo lượng phoi thải cực lớn, tốn dao cụ và thời gian gia công đắt đỏ gấp nhiều lần.`},{id:`opt3`,text:`Hàn ghép hàng trăm miếng tôn mỏng lại thành vỏ máy`,isCorrect:!1,engineerFeedback:`Không an toàn! Quá nhiều đường hàn sẽ làm vỏ máy dễ bị rò rỉ nước áp lực cao và mất tính thẩm mỹ.`},{id:`opt4`,text:`Kéo kim loại qua lỗ khuôn tròn`,isCorrect:!1,engineerFeedback:`Sai công nghệ! Kéo kim loại chỉ dùng để chế tạo dây kim loại hoặc ống dài không hạn chế, không tạo được vỏ động cơ có khoang.`}],realWorldImpact:`Giảm 60% giá thành phôi và tăng độ cứng vững giảm rung động cho máy bơm nước.`},{id:`eng-b3-s2-1`,lessonId:`bai-3`,title:`Tình huống 3: Thiết kế hệ thống đóng ngắt van xả tự động trong nhà máy`,explanation:`Bài 3 mục II.3 SGK trang 20: Công nghệ điện - cơ biến đổi điện năng thành cơ năng dạng tịnh tiến (như van điện từ, relay/rơ le) được dùng rộng rãi để điều khiển đường ống chất lỏng và mạch điện tự động.`,type:`engineer`,role:`Kỹ sư Tự động hoá & Thiết bị Điện`,scenario:`Trong nhà máy chế biến thực phẩm, khi cảm biến báo bể chứa sữa đã đầy 100%, hệ thống cần kích hoạt một thiết bị cơ học để đóng lập tức đường ống dẫn chất lỏng mà không cần công nhân vặn van tay. Bạn đề xuất thiết bị nào?`,options:[{id:`opt1`,text:`Van điện từ (Solenoid Valve) - Công nghệ Điện - Cơ dạng tịnh tiến`,isCorrect:!0,engineerFeedback:`Rất chính xác! Van điện từ biến tín hiệu điện năng thành chuyển động tịnh tiến hút/đẩy lõi thép để đóng ngắt tức thì đường ống chất lỏng hoàn toàn tự động.`},{id:`opt2`,text:`Lắp một bóng đèn huỳnh quang công suất lớn để làm bay hơi sữa dư`,isCorrect:!1,engineerFeedback:`Hoàn toàn sai lầm! Đèn huỳnh quang chỉ biến điện thành ánh sáng chiếu sáng, không tạo ra lực cơ học để đóng mở đường ống.`},{id:`opt3`,text:`Lắp thêm một động cơ quạt gió để thổi nguội`,isCorrect:!1,engineerFeedback:`Không đúng! Quạt điện tạo ra chuyển động quay gió, không có chức năng chặn kín đường ống chất lỏng.`},{id:`opt4`,text:`Sử dụng que hàn nung chảy bít kín đầu ống lại vĩnh viễn`,isCorrect:!1,engineerFeedback:`Vô lý! Bịt kín vĩnh viễn sẽ phá hỏng dây chuyền và không thể mở lại cho mẻ sản xuất tiếp theo.`}],realWorldImpact:`Ứng dụng trong tự động hóa nhà máy nước sạch, dầu khí và thực phẩm an toàn.`},{id:`eng-b3-s2-2`,lessonId:`bai-3`,title:`Tình huống 4: Nâng cấp giải pháp chiếu sáng tiết kiệm năng lượng cho trường học`,explanation:`Bài 3 mục II.2 SGK trang 20: Đèn LED (2006) hoạt động dựa trên nguyên lí chuyển trực tiếp từ điện năng thành quang năng khi có dòng điện một chiều chạy qua diode, có tuổi thọ cao và tiết kiệm điện năng vượt trội so với đèn sợi đốt và đèn huỳnh quang.`,type:`engineer`,role:`Kỹ sư Năng lượng & Công trình xanh`,scenario:`Trường học của bạn đang sử dụng hệ thống đèn sợi đốt cũ tiêu hao nhiều điện và tỏa nhiệt nóng bức mùa hè. Ban Giám hiệu yêu cầu thay thế bằng giải pháp chiếu sáng hiện đại, thân thiện thị lực học sinh và tiết kiệm tiền điện tối đa. Phương án của bạn?`,options:[{id:`opt1`,text:`Thay toàn bộ bằng hệ thống đèn LED (Light Emitting Diode) chuẩn quang thông học đường`,isCorrect:!0,engineerFeedback:`Lựa chọn chuẩn xác của kỹ sư! Đèn LED tiêu thụ điện ít hơn 80% so với đèn sợi đốt, không tỏa nhiệt bức xạ nhiệt hồng ngoại lớn và có tuổi thọ gấp 10-20 lần.`},{id:`opt2`,text:`Nâng công suất bóng đèn sợi đốt lên gấp đôi để học sinh nhìn rõ hơn`,isCorrect:!1,engineerFeedback:`Rất nguy hiểm và tốn kém! Đèn sợi đốt biến 95% điện năng thành nhiệt năng, sẽ làm phòng học cực kỳ nóng và hóa đơn tiền điện tăng vọt.`},{id:`opt3`,text:`Tháo bỏ toàn bộ đèn điện và chỉ học vào ban ngày`,isCorrect:!1,engineerFeedback:`Không khả thi vào những ngày trời mưa bão âm u hoặc các buổi học chiều muộn.`},{id:`opt4`,text:`Chuyển sang dùng máy phát điện chạy than đá đặt ngay trong lớp học`,isCorrect:!1,engineerFeedback:`Nguy hiểm chết người do khí độc CO và tiếng ồn khói bụi!`}],realWorldImpact:`Giúp các trường học tiết kiệm hàng chục triệu đồng tiền điện mỗi tháng và bảo vệ môi trường.`},{id:`eng-b4-s1-1`,lessonId:`bai-4`,title:`Tình huống 5: Tái tạo xương khớp hàm nhân tạo cho bệnh nhân phẫu thuật`,explanation:`Bài 4 mục 3 SGK trang 25: Công nghệ in 3D được ứng dụng rộng rãi trong y học (như in xương nhân tạo, khớp nhân tạo tương thích sinh học cao) bằng cách đắp vật liệu theo từng lớp chuẩn xác với dữ liệu quét cắt lớp 3D của bệnh nhân.`,type:`engineer`,role:`Kỹ sư Kỹ thuật Y sinh (Biomedical Engineer)`,scenario:`Một bệnh viện cần tạo một mảnh ghép xương gò má titan có cấu trúc vi mô rỗng phức tạp, hoàn toàn trùng khớp với cấu trúc giải phẫu riêng của từng bệnh nhân sau tai nạn. Bạn sẽ dùng công nghệ mới nào?`,options:[{id:`opt1`,text:`Công nghệ In 3D kim loại sinh học (đắp từng lớp bột titan theo mô hình quét CT)`,isCorrect:!0,engineerFeedback:`Tuyệt vời! Công nghệ in 3D là phương pháp duy nhất có thể chế tạo các cấu trúc xương nhân tạo rỗng có độ tương thích sinh học theo từng milimet khớp với cơ thể người bệnh.`},{id:`opt2`,text:`Đúc khuôn cát thủ công từ kim loại đồng thau`,isCorrect:!1,engineerFeedback:`Tuyệt đối không được! Đồng thau có tính độc tế bào và đúc khuôn cát không đạt độ chính xác cho cấy ghép nội tạng người.`},{id:`opt3`,text:`Dùng búa rèn tấm sắt nguội theo cảm tính của kỹ sư`,isCorrect:!1,engineerFeedback:`Phản khoa học và gây nhiễm trùng nguy hiểm đến tính mạng người bệnh.`},{id:`opt4`,text:`Sử dụng công nghệ hàn nung chảy các mẩu dây thép lại với nhau`,isCorrect:!1,engineerFeedback:`Không thể ứng dụng trong y học vì gây viêm nhiễm và không tương thích giải phẫu.`}],realWorldImpact:`Đột phá ngành y học tái tạo, giúp cứu sống và hồi phục chức năng cho hàng vạn bệnh nhân.`},{id:`eng-b4-s1-2`,lessonId:`bai-4`,title:`Tình huống 6: Ứng dụng dệt may kháng khuẩn bảo vệ y bác sĩ chống dịch`,explanation:`Bài 4 mục 1 SGK trang 24: Trong may mặc, công nghệ nano được ứng dụng trong một số loại vải đặc biệt bằng cách đưa các hạt nano bạc vào sợi vải, các hạt này có khả năng thu hút và tiêu diệt các vi khuẩn bám trên quần áo.`,type:`engineer`,role:`Kỹ sư Vật liệu Tiên tiến`,scenario:`Một xưởng may quân đội muốn sản xuất trang phục bảo hộ dã chiến có khả năng tự khử mùi hôi cơ thể và ngăn chặn vi khuẩn, vi rút bám dính mà giặt nhiều lần vẫn không mất tính năng. Bạn sẽ tích hợp vật liệu gì vào sợi vải?`,options:[{id:`opt1`,text:`Tích hợp các hạt Nano Bạc (Ag NPs) siêu nhỏ kích thước 1-100 nm vào sợi vải`,isCorrect:!0,engineerFeedback:`Rất chuẩn mực SGK! Hạt nano bạc giải phóng ion bạc (Ag+) có khả năng phá vỡ màng tế bào vi khuẩn, mang lại khả năng diệt khuẩn bền vững qua nhiều lần giặt.`},{id:`opt2`,text:`Ngâm vải vào nước muối đặc mỗi ngày trước khi mặc`,isCorrect:!1,engineerFeedback:`Không hiệu quả! Nước muối sẽ khô kết tinh làm rách sợi vải và bị trôi sạch sau vài phút đổ mồ hôi.`},{id:`opt3`,text:`Bọc một lớp tôn kim loại đen bên ngoài trang phục`,isCorrect:!1,engineerFeedback:`Vô lý! Áo giáp tôn kim loại nặng nề, bí bách và cản trở hoàn toàn khả năng di chuyển tác chiến.`},{id:`opt4`,text:`Sử dụng máy tính cá nhân cài phần mềm diệt vi rút máy tính để quét lên áo`,isCorrect:!1,engineerFeedback:`Nhầm lẫn khôi hài giữa vi rút sinh học ngoài đời và vi rút máy tính số!`}],realWorldImpact:`Ứng dụng trong trang phục phi hành gia, y bác sĩ phòng dịch và đồ thể thao cao cấp.`},{id:`eng-b4-s2-1`,lessonId:`bai-4`,title:`Tình huống 7: Tự động hóa nông trại tưới tiêu dưa lưới thông minh từ xa`,explanation:`Bài 4 mục 6 SGK trang 28: Công nghệ Internet vạn vật (IoT) kết nối mọi thiết bị với internet, giúp máy móc trở nên thông minh hơn nhờ khả năng gửi và nhận thông tin tự động dựa trên cảm biến.`,type:`engineer`,role:`Kỹ sư Nông nghiệp Công nghệ cao`,scenario:`Một chủ nông trại muốn theo dõi độ ẩm đất, nhiệt độ nhà kính trồng dưa lưới từ điện thoại thông minh, và khi đất khô thì máy bơm tự động kích hoạt tưới nhỏ giọt đúng lượng nước quy định. Bạn sẽ thiết kế hệ thống dựa trên nền tảng công nghệ nào?`,options:[{id:`opt1`,text:`Hệ thống Internet vạn vật (IoT) gồm cảm biến đo ẩm độ đất, vi điều khiển Wi-Fi và van điện từ`,isCorrect:!0,engineerFeedback:`Chính xác 100%! IoT kết nối cảm biến độ ẩm truyền dữ liệu lên đám mây, tự động kích hoạt bơm tưới và gửi thông báo trực quan về smartphone của chủ vườn mọi lúc mọi nơi.`},{id:`opt2`,text:`Dùng một cỗ máy hơi nước James Watt đốt than liên tục để bơm nước tràn lan`,isCorrect:!1,engineerFeedback:`Công nghệ quá lỗi thời! Vừa gây ô nhiễm môi trường vừa làm ngập úng thối rễ cây trồng.`},{id:`opt3`,text:`Cắt gọt một chiếc cờ lê bằng máy phay CNC để công nhân cầm tay đi kiểm tra`,isCorrect:!1,engineerFeedback:`Không liên quan đến tự động hóa và đo lường thông số môi trường.`},{id:`opt4`,text:`Lắp một đèn huỳnh quang chiếu sáng liên tục suốt ngày đêm`,isCorrect:!1,engineerFeedback:`Đèn huỳnh quang không đo được độ ẩm của đất và làm rối loạn chu kỳ sinh trưởng của cây.`}],realWorldImpact:`Tiết kiệm 50% nước tưới, tăng 30% năng suất nông sản sạch đạt chuẩn xuất khẩu.`},{id:`eng-b4-s2-2`,lessonId:`bai-4`,title:`Tình huống 8: Phân loại kiện hàng bưu kiện tốc độ cao trong kho vận logistics`,explanation:`Bài 4 mục 5 & 7 SGK trang 27-28: Trí tuệ nhân tạo (AI) nhận dạng hình ảnh kết hợp Robot thông minh có khả năng nhận thức môi trường, tự ra quyết định di chuyển và phân loại bưu kiện an toàn, chính xác.`,type:`engineer`,role:`Kỹ sư Hệ thống Logistics & Chuỗi cung ứng`,scenario:`Trung tâm phân loại bưu điện tiếp nhận 500.000 kiện hàng mỗi ngày. Việc công nhân đọc mã vạch và bê vác tay thủ công dẫn đến quá tải và nhầm lẫn hàng. Bạn đề xuất phương án chuyển đổi nào?`,options:[{id:`opt1`,text:`Triển khai dàn Robot thông minh tự hành (AMR) tích hợp thị giác máy tính AI nhận diện mã vạch và phân loại tự động`,isCorrect:!0,engineerFeedback:`Giải pháp hiện đại bậc nhất! Robot thông minh có bộ não AI đọc camera tốc độ mili-giây, tự tìm đường đi tối ưu trong kho mà không bao giờ mệt mỏi hay nhầm lẫn.`},{id:`opt2`,text:`Yêu cầu người gửi tự đến kho tìm và lấy kiện hàng của mình`,isCorrect:!1,engineerFeedback:`Phá vỡ quy trình dịch vụ bưu chính và gây hỗn loạn mất an ninh trật tự kho.`},{id:`opt3`,text:`Dùng phương pháp đúc kim loại đúc thành từng khối kim loại bọc ngoài gói hàng`,isCorrect:!1,engineerFeedback:`Hư hỏng toàn bộ hàng hóa bên trong và làm tăng trọng lượng phi lý.`},{id:`opt4`,text:`Chuyển về dùng xe ngựa thồ hàng để tiết kiệm điện thoại`,isCorrect:!1,engineerFeedback:`Thụt lùi lịch sử về thời tiền công nghiệp thế kỉ XVII!`}],realWorldImpact:`Nâng tốc độ xử lý đơn hàng lên gấp 10 lần, giao hàng hỏa tốc trong 24 giờ trên toàn quốc.`},{id:`eng-b6-s1-1`,lessonId:`bai-6`,title:`Tình huống 9: Tối ưu hoá năng suất xưởng lắp ráp ô tô theo bài học Lịch sử`,explanation:`Bài 6 mục 2 SGK trang 35: Năm 1908, Henry Ford đã áp dụng dây chuyền sản xuất hàng loạt chuyển động liên tục cho xe hơi, đưa sản xuất từ thủ công sang kỷ nguyên công nghiệp quy mô lớn của CMCN 2.0.`,type:`engineer`,role:`Kỹ sư Trưởng Dây chuyền Lắp ráp`,scenario:`Một xưởng cơ khí lắp ráp máy gặt lúa đang để mỗi thợ đứng một chỗ làm từ đầu đến cuối một chiếc máy, khiến sản lượng rất thấp và giá thành cao. Vận dụng bài học lịch sử từ cuộc Cách mạng Công nghiệp lần thứ hai, bạn sẽ cải tiến ra sao?`,options:[{id:`opt1`,text:`Áp dụng nguyên lí dây chuyền sản xuất hàng loạt chuyển động, chuyên môn hoá thao tác của từng công nhân (mô hình Henry Ford)`,isCorrect:!0,engineerFeedback:`Bài học đắt giá của lịch sử công nghệ! Dây chuyền băng tải chuyển động giúp phân chia công việc chuyên biệt hóa, tăng vọt năng suất và giảm mạnh chi phí sản xuất.`},{id:`opt2`,text:`Bắt công nhân quay lại làm rèn thủ công bằng búa như thế kỉ XVIII`,isCorrect:!1,engineerFeedback:`Thụt lùi công nghệ, làm giảm năng suất nghiêm trọng.`},{id:`opt3`,text:`Đóng cửa nhà máy và chờ phát minh mới xuất hiện`,isCorrect:!1,engineerFeedback:`Quyết định thiếu tính xây dựng của một kỹ sư.`},{id:`opt4`,text:`Thay động cơ điện bằng máy kéo hơi nước chạy củi đốt`,isCorrect:!1,engineerFeedback:`Lạc hậu hơn 100 năm và gây khói bụi nguy hiểm trong nhà xưởng.`}],realWorldImpact:`Cơ sở của nền sản xuất công nghiệp hiện đại, đưa ô tô và thiết bị gia dụng đến từng gia đình.`},{id:`eng-b6-s1-2`,lessonId:`bai-6`,title:`Tình huống 10: Vượt qua ranh giới khoảng cách trong CMCN 3.0`,explanation:`Bài 6 mục 3 SGK trang 36: Cuộc cách mạng công nghiệp lần thứ 3 (những năm 70 TK XX) với sự ra đời của máy tính và mạng Internet (1990) đã xoá nhoà ranh giới giữa các nhà máy, vùng miền, quốc gia và mang lại sự kết nối thông tin toàn cầu.`,type:`engineer`,role:`Kỹ sư Viễn thông & Mạng lưới`,scenario:`Tập đoàn bạn có văn phòng thiết kế ở Hà Nội, xưởng cơ khí ở Đà Nẵng và chi nhánh lắp ráp ở TP. Hồ Chí Minh. Làm thế nào để các kỹ sư có thể cùng đồng bộ bản vẽ kỹ thuật CAD theo thời gian thực mà không phải đi tàu xe gửi đĩa mềm?`,options:[{id:`opt1`,text:`Thiết lập mạng diện rộng Internet / Intranet đồng bộ dữ liệu kỹ thuật số qua máy chủ đám mây`,isCorrect:!0,engineerFeedback:`Chính xác! Thành tựu mạng Internet của CMCN lần 3 cho phép truyền tải tức thời các tập tin kỹ thuật dung lượng lớn giữa các vùng địa lý cách xa nhau.`},{id:`opt2`,text:`In bản vẽ ra giấy và thuê chim bồ câu đưa thư bay qua lại`,isCorrect:!1,engineerFeedback:`Phương thức cổ xưa, bản vẽ kỹ thuật nặng nề bồ câu không thể mang vác và cực kỳ dễ thất lạc.`},{id:`opt3`,text:`Chờ tàu hỏa hơi nước chở bản vẽ giấy giữa các thành phố`,isCorrect:!1,engineerFeedback:`Mất nhiều ngày làm chậm trễ nghiêm trọng tiến độ dự án kỹ thuật.`},{id:`opt4`,text:`Mỗi nơi tự vẽ theo ý mình không cần liên hệ với nhau`,isCorrect:!1,engineerFeedback:`Khi lắp ráp các bộ phận sẽ không khớp nhau, gây thiệt hại hàng tỷ đồng.`}],realWorldImpact:`Tạo tiền đề cho xu hướng làm việc toàn cầu hóa (Global Collaboration) và chuỗi cung ứng quốc tế.`},{id:`eng-b6-s2-1`,lessonId:`bai-6`,title:`Tình huống 11: Xây dựng Nhà máy Thông minh (Smart Factory) trong kỷ nguyên 4.0`,explanation:`Bài 6 mục Thông tin bổ sung trang 38: Nhà máy thông minh trong CMCN 4.0 có khả năng vận hành tự động hoá hoàn toàn 24/7 nhờ kết nối IoT, dữ liệu lớn Big Data xử lý tự động đồng bộ từ khâu đầu vào đến khâu đầu ra.`,type:`engineer`,role:`Giám đốc Chuyển đổi số Nhà máy 4.0`,scenario:`Bạn được giao nhiệm vụ nâng cấp nhà máy sản xuất linh kiện điện tử thành một Nhà máy Thông minh (Smart Factory). Yếu tố cốt lõi nào bạn bắt buộc phải trang bị cho toàn bộ hệ thống?`,options:[{id:`opt1`,text:`Hệ thống cảm biến IoT liên kết Big Data, AI phân tích dữ liệu đồng bộ và robot vận hành liên tục 24/7`,isCorrect:!0,engineerFeedback:`Đẳng cấp kỹ sư 4.0! Smart Factory đòi hỏi liên kết khép kín giữa máy móc vật lý với không gian dữ liệu số (Cyber-Physical Systems) để máy tự ra quyết định và tự thích ứng.`},{id:`opt2`,text:`Chỉ cần sơn tường nhà máy màu xanh lam và dán khẩu hiệu 4.0`,isCorrect:!1,engineerFeedback:`Chỉ là hình thức bên ngoài, không có bất kỳ hàm lượng công nghệ nào thay đổi.`},{id:`opt3`,text:`Mua thêm thật nhiều máy dệt thủ công chạy bằng bàn đạp chân`,isCorrect:!1,engineerFeedback:`Hoàn toàn đi ngược lại bản chất tự động hóa của kỷ nguyên số.`},{id:`opt4`,text:`Ngắt toàn bộ mạng Internet để tránh rò rỉ dữ liệu`,isCorrect:!1,engineerFeedback:`Mất kết nối sẽ làm tê liệt toàn bộ khả năng tương tác của nhà máy thông minh.`}],realWorldImpact:`Giúp doanh nghiệp tăng gấp đôi năng suất, giảm 40% chi phí vận hành và không bị đào thải trong kỷ nguyên số.`},{id:`eng-b6-s2-2`,lessonId:`bai-6`,title:`Tình huống 12: Đột phá công nghệ giải phóng sức lao động trong CMCN 1.0`,explanation:`Bài 6 mục 1 SGK trang 34: Động cơ hơi nước của James Watt (1784) đã tạo ra bước bứt phá trong công nghiệp, thay thế sức người, sức kéo động vật và các nguồn năng lượng thiên nhiên bấp bênh (nước, gió) bằng nguồn động lực cơ học nhân tạo chủ động.`,type:`engineer`,role:`Kỹ sư Sử học Công nghệ`,scenario:`Vào cuối thế kỉ XVIII, một chủ mỏ than ở nước Anh gặp bế tắc vì nước ngầm tràn ngập hầm mỏ, trong khi sức ngựa kéo gầu nước không đủ nhanh để cứu mỏ. Phát minh nào đã giải quyết triệt để bài toán này và mở ra kỷ nguyên mới?`,options:[{id:`opt1`,text:`Động cơ hơi nước cải tiến của James Watt dẫn động máy bơm hút nước liên tục`,isCorrect:!0,engineerFeedback:`Chính xác! Động cơ hơi nước của James Watt có thể hoạt động bền bỉ, công suất lớn, hút cạn nước ngầm trong hầm mỏ và sau đó được ứng dụng vào xe lửa, tàu thủy và nhà máy dệt.`},{id:`opt2`,text:`Sử dụng hệ thống pin mặt trời và động cơ servo không chổi than`,isCorrect:!1,engineerFeedback:`Sai thời đại! Vào thế kỉ XVIII loài người chưa phát minh ra pin mặt trời hay công nghệ điện.`},{id:`opt3`,text:`Thả cá ăn bùn xuống đáy hầm than`,isCorrect:!1,engineerFeedback:`Vô lý và không thể hạ được mực nước ngầm áp lực cao.`},{id:`opt4`,text:`Dùng máy bay phản lực để thổi khô nước`,isCorrect:!1,engineerFeedback:`Máy bay chỉ xuất hiện vào đầu thế kỉ XX (anh em Wright 1903).`}],realWorldImpact:`Mở ra cuộc Cách mạng Công nghiệp đầu tiên của nhân loại làm thay đổi vĩnh viễn văn minh thế giới.`},{id:`eng-th-s1-1`,lessonId:`tong-hop`,title:`Tình huống 13: Xây dựng giải pháp sản xuất xe máy điện thông minh Việt Nam`,explanation:`Tổng hợp Bài 3, 4, 6: Khung xe gia công dập/hàn (Bài 3); Động cơ điện và pin năng lượng sạch (Bài 3 & 4); Hệ thống định vị IoT và AI tự lái/chống trộm (Bài 4 & 6).`,type:`engineer`,role:`Tổng công trình sư Xe máy điện Thông minh`,scenario:`Đội ngũ của bạn đang chế tạo xe máy điện thế hệ mới cho học sinh sinh viên. Dự án đòi hỏi: khung sườn thép chắc chắn, động cơ điện êm ái tiết kiệm điện, và xe có tính năng kết nối điện thoại cảnh báo chống trộm thông minh. Bạn sẽ phối hợp các công nghệ nào?`,options:[{id:`opt1`,text:`Kết hợp: Gia công cán ép sườn xe (Bài 3) + Động cơ điện - cơ hiệu suất cao (Bài 3) + Kết nối IoT định vị và AI quản lý pin (Bài 4 & 6)`,isCorrect:!0,engineerFeedback:`Tư duy kỹ thuật liên ngành xuất sắc! Một sản phẩm công nghệ hiện đại luôn là sự phối hợp hài hòa giữa cơ khí luyện kim nền tảng, công nghệ chuyển đổi năng lượng và công nghệ số thông minh.`},{id:`opt2`,text:`Chỉ lắp một động cơ hơi nước đốt than cồng kềnh phía sau yên xe`,isCorrect:!1,engineerFeedback:`Bốc khói đen kịt, cồng kềnh, dễ gây bỏng cho người điều khiển và vi phạm luật giao thông.`},{id:`opt3`,text:`Đúc toàn bộ chiếc xe bằng một khối xi măng đặc`,isCorrect:!1,engineerFeedback:`Xe quá nặng, không thể di chuyển và không chứa được các mạch điện tử.`},{id:`opt4`,text:`Bỏ qua khung xe và động cơ, chỉ cài một ứng dụng trên điện thoại`,isCorrect:!1,engineerFeedback:`Một ứng dụng phần mềm không thể chở người đi trên đường nếu thiếu phần cứng cơ khí!`}],realWorldImpact:`Thúc đẩy giao thông xanh, giảm khí thải carbon bảo vệ bầu không khí các đô thị lớn.`},{id:`eng-th-s2-1`,lessonId:`tong-hop`,title:`Tình huống 14: Ứng cứu sự cố sạt lở đường ống năng lượng vùng cao`,explanation:`Tổng hợp SGK: Khảo sát địa hình bằng flycam/robot AI (Bài 4); Nhanh chóng in 3D hoặc gia công CNC cút nối thay thế (Bài 4); Hàn áp lực hoặc nối ống chắc chắn (Bài 3); Truyền dữ liệu qua mạng không dây 4G/5G (Bài 3).`,type:`engineer`,role:`Kỹ sư Ứng cứu Khẩn cấp Nhà máy Thủy điện`,scenario:`Mưa lũ gây sạt lở làm nứt vỡ một đoạn cút nối kim loại uốn cong đặc thù của đường ống áp lực dẫn nước vào tuabin thủy điện trên núi cao hiểm trở, xe tải không vào được. Bạn sẽ xử lý thế nào để khôi phục nhanh nhất?`,options:[{id:`opt1`,text:`Dùng thiết bị quét 3D đo đạc gửi dữ liệu qua mạng vô tuyến -> Gia công chi tiết thay thế bằng máy CNC / In 3D kim loại -> Dùng drone cẩu đến và hàn hồ quang cố định`,isCorrect:!0,engineerFeedback:`Giải pháp của một kỹ sư tương lai tài năng! Tận dụng sức mạnh số hóa 4.0, truyền thông vô tuyến kết hợp gia công hiện đại và kỹ thuật hàn cơ khí giúp giải quyết bài toán hóc búa trong thời gian ngắn nhất.`},{id:`opt2`,text:`Dùng băng dính dán quanh đường ống nước áp lực cao`,isCorrect:!1,engineerFeedback:`Băng dính sẽ vỡ toang ngay lập tức trước áp lực cột nước hàng trăm tấn!`},{id:`opt3`,text:`Ngồi chờ mùa khô năm sau khi đường bộ khô ráo mới tính tiếp`,isCorrect:!1,engineerFeedback:`Làm mất điện cả một vùng dân cư rộng lớn trong nhiều tháng trời.`},{id:`opt4`,text:`Đập phá toàn bộ con đập thủy điện xây lại từ đầu`,isCorrect:!1,engineerFeedback:`Phá hoại công trình trọng điểm quốc gia và gây thảm họa lũ lụt nhân tạo!`}],realWorldImpact:`Ứng dụng thực tế trong bảo trì công trình hạ tầng quốc gia và cứu hộ thiên tai hiểm trở.`}],ee=[{lessonId:`bai-3`,setIndex:1,title:`Bài 3 - Bộ 1: Công nghệ Luyện kim, Cơ khí và Điện - Điện tử`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-b3-s1-q1`,lessonId:`bai-3`,type:`true-false`,title:`Câu 1. Các công nghệ gia công cơ khí trong sản xuất`,stem:`Trong quá trình gia công chế tạo các chi tiết máy bằng kim loại, người ta ứng dụng nhiều phương pháp công nghệ cơ khí khác nhau như đúc, hàn, gia công cắt gọt và gia công áp lực nhằm biến đổi hình dạng, kích thước và cơ tính của vật liệu.`,explanation:`SGK Công nghệ 10 (Bài 3): Nắm rõ bản chất của công nghệ đúc, hàn, gia công cắt gọt và gia công áp lực.`,statements:[{id:`tf-b3-s1-q1-a`,label:`a`,text:`Công nghệ đúc là phương pháp nấu chảy kim loại rồi rót vào khuôn có hình dạng, kích thước của sản phẩm cần tạo.`,isCorrect:!0,explanation:`Đúng. Theo SGK Công nghệ 10, đúc là phương pháp chế tạo sản phẩm bằng cách nấu chảy kim loại, rót kim loại lỏng vào khuôn có hình dáng, kích thước của sản phẩm, sau khi nguội sẽ thu được vật đúc.`},{id:`tf-b3-s1-q1-b`,label:`b`,text:`Gia công cắt gọt là phương pháp bóc tách lớp kim loại thừa trên phôi dưới dạng phoi nhờ các dụng cụ cắt để đạt hình dáng chính xác.`,isCorrect:!0,explanation:`Đúng. Gia công cắt gọt (tiện, phay, bào, mài, khoan...) dùng dụng cụ cắt để tách lớp kim loại thừa dưới dạng phoi.`},{id:`tf-b3-s1-q1-c`,label:`c`,text:`Gia công áp lực (rèn, dập, cán, kéo) làm thay đổi hình dạng của kim loại bằng cách bóc tách phoi kim loại thừa.`,isCorrect:!1,explanation:`Sai. Gia công áp lực dựa vào tính dẻo của kim loại dưới tác dụng của ngoại lực để biến dạng mà không bóc tách phoi thừa.`},{id:`tf-b3-s1-q1-d`,label:`d`,text:`Mối hàn được tạo thành là mối nối có thể tháo rời dễ dàng mà không làm phá hỏng liên kết kim loại.`,isCorrect:!1,explanation:`Sai. Hàn là phương pháp nối các chi tiết kim loại với nhau bằng cách nung nóng chỗ nối đến trạng thái chảy hoặc dẻo, tạo thành mối ghép cố định không tháo rời được.`}]},{id:`tf-b3-s1-q2`,lessonId:`bai-3`,type:`true-false`,title:`Câu 2. Công nghệ Điện và Điện - Điện tử`,stem:`Điện năng đóng vai trò huyết mạch trong đời sống và sản xuất hiện đại. Các công nghệ điện gồm sản xuất điện năng, điện - quang, điện - cơ, điều khiển tự động và truyền thông không dây.`,explanation:`SGK Công nghệ 10 (Bài 3): Phân biệt các công nghệ thuộc nhóm ngành Điện - Điện tử.`,statements:[{id:`tf-b3-s1-q2-a`,label:`a`,text:`Công nghệ điện - quang biến đổi điện năng thành quang năng để chiếu sáng và trang trí.`,isCorrect:!0,explanation:`Đúng. Thiết bị điện - quang như đèn sợi đốt, đèn huỳnh quang, đèn LED biến đổi điện năng thành quang năng.`},{id:`tf-b3-s1-q2-b`,label:`b`,text:`Đèn LED tiêu thụ điện năng lớn hơn đèn sợi đốt và đèn huỳnh quang ở cùng mức độ chiếu sáng.`,isCorrect:!1,explanation:`Sai. Đèn LED có hiệu suất phát quang cao nhất, tiết kiệm điện năng vượt trội và tuổi thọ cao hơn đèn sợi đốt và huỳnh quang.`},{id:`tf-b3-s1-q2-c`,label:`c`,text:`Động cơ điện trong máy bơm, quạt điện, máy tiện hoạt động dựa trên công nghệ điện - cơ (biến điện năng thành cơ năng).`,isCorrect:!0,explanation:`Đúng. Công nghệ điện - cơ sử dụng hiện tượng cảm ứng điện từ để chuyển đổi điện năng thành cơ năng quay hoặc tịnh tiến.`},{id:`tf-b3-s1-q2-d`,label:`d`,text:`Sóng vô tuyến điện trong truyền thông không dây truyền tín hiệu đi xa chỉ qua dây cáp dẫn điện bằng kim loại.`,isCorrect:!1,explanation:`Sai. Truyền thông không dây sử dụng sóng điện từ lan truyền trong không gian mà không cần dây dẫn vật lý.`}]}]},{lessonId:`bai-3`,setIndex:2,title:`Bài 3 - Bộ 2: Luyện kim, Gia công cơ khí & Tự động hoá`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-b3-s2-q1`,lessonId:`bai-3`,type:`true-false`,title:`Câu 1. Bản chất công nghệ luyện kim và đúc kim loại`,stem:`Công nghệ luyện kim và đúc là nền tảng khởi nguồn cho hầu hết các chuỗi cung ứng vật liệu và chi tiết cơ khí trong công nghiệp chế tạo máy.`,explanation:`SGK Công nghệ 10 (Bài 3): Nguyên lý công nghệ luyện kim đen, luyện kim màu và phương pháp đúc.`,statements:[{id:`tf-b3-s2-q1-a`,label:`a`,text:`Luyện kim đen là công nghệ sản xuất gang và thép từ quặng sắt.`,isCorrect:!0,explanation:`Đúng. Kim loại đen bao gồm gang và thép (hợp kim của sắt với cacbon), sản phẩm của công nghệ luyện kim đen.`},{id:`tf-b3-s2-q1-b`,label:`b`,text:`Luyện kim màu là công nghệ điều chế các kim loại như nhôm, đồng, titan, niken từ quặng tương ứng.`,isCorrect:!0,explanation:`Đúng. Kim loại màu là các kim loại không chứa sắt hoặc hàm lượng sắt rất thấp như nhôm, đồng, chì, kẽm, titan.`},{id:`tf-b3-s2-q1-c`,label:`c`,text:`Phương pháp đúc không thể chế tạo được các chi tiết có hình dáng phức tạp hoặc ruột rỗng bên trong.`,isCorrect:!1,explanation:`Sai. Đúc là phương pháp ưu việt để tạo ra các chi tiết có kết cấu phức tạp, ruột rỗng bên trong (nhờ làm lõi) như thân máy, lốc động cơ.`},{id:`tf-b3-s2-q1-d`,label:`d`,text:`Sản phẩm của quá trình đúc kim loại được gọi là vật đúc.`,isCorrect:!0,explanation:`Đúng. Kim loại lỏng đông đặc trong lòng khuôn tạo ra vật đúc.`}]},{id:`tf-b3-s2-q2`,lessonId:`bai-3`,type:`true-false`,title:`Câu 2. Điều khiển tự động và Sản xuất điện năng`,stem:`Hệ thống tự động hóa và nguồn điện năng ổn định đóng vai trò quyết định đối với năng suất, chất lượng và độ an toàn của nền sản xuất hiện đại.`,explanation:`SGK Công nghệ 10 (Bài 3): Công nghệ điều khiển tự động và các dạng nhà máy phát điện.`,statements:[{id:`tf-b3-s2-q2-a`,label:`a`,text:`Nhà máy nhiệt điện sử dụng năng lượng nhiệt của than đá, dầu khí để đun sôi nước tạo hơi nước áp suất cao quay tuabin.`,isCorrect:!0,explanation:`Đúng. Đây là nguyên lý hoạt động cơ bản của nhà máy nhiệt điện truyền thống.`},{id:`tf-b3-s2-q2-b`,label:`b`,text:`Công nghệ điều khiển tự động giúp hệ thống máy móc vận hành mà không cần sự can thiệp trực tiếp của con người.`,isCorrect:!0,explanation:`Đúng. Điều khiển tự động sử dụng cảm biến, bộ điều khiển và cơ cấu chấp hành để máy tự động điều chỉnh.`},{id:`tf-b3-s2-q2-c`,label:`c`,text:`Hệ thống điều hòa nhiệt độ phòng tự động tắt khi nhiệt độ đạt mức cài đặt là một ví dụ về điều khiển tự động.`,isCorrect:!0,explanation:`Đúng. Cảm biến nhiệt gửi tín hiệu về vi xử lý để tự động đóng/ngắt mạch máy nén duy trì nhiệt độ đặt trước.`},{id:`tf-b3-s2-q2-d`,label:`d`,text:`Truyền thông không dây chỉ cho phép truyền thông tin ở cự ly gần dưới 1 mét, không thể truyền dữ liệu toàn cầu.`,isCorrect:!1,explanation:`Sai. Truyền thông không dây bao gồm vệ tinh viễn thông, mạng 4G/5G phủ sóng toàn cầu xuyên lục địa.`}]}]},{lessonId:`bai-4`,setIndex:1,title:`Bài 4 - Bộ 1: Công nghệ Nano, CAD/CAM/CNC và In 3D`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-b4-s1-q1`,lessonId:`bai-4`,type:`true-false`,title:`Câu 1. Công nghệ Nano và In 3D trong sản xuất hiện đại`,stem:`Công nghệ vật liệu mới và các phương pháp chế tạo bồi đắp đang tạo ra bước ngoặt đột phá cho y học, điện tử và cơ khí chế tạo.`,explanation:`SGK Công nghệ 10 (Bài 4): Kích thước hạt nano (1-100 nm) và nguyên lý tạo hình đắp lớp của in 3D.`,statements:[{id:`tf-b4-s1-q1-a`,label:`a`,text:`Vật liệu nano là vật liệu có kích thước cấu trúc hạt trong khoảng từ 1 nanômét đến 100 nanômét.`,isCorrect:!0,explanation:`Đúng. 1 nm = 10^-9 m. Vật liệu nano có kích thước đặc trưng từ 1 đến 100 nm với nhiều tính chất cơ, lý, hóa đặc biệt.`},{id:`tf-b4-s1-q1-b`,label:`b`,text:`Khi vật liệu chuyển sang kích thước nano, diện tích bề mặt riêng giảm đi rất nhiều nên hoạt tính xúc tác bị suy giảm.`,isCorrect:!1,explanation:`Sai. Kích thước hạt càng nhỏ thì diện tích bề mặt riêng trên một đơn vị khối lượng càng tăng vọt, làm tăng mạnh hoạt tính hóa học và xúc tác.`},{id:`tf-b4-s1-q1-c`,label:`c`,text:`Công nghệ in 3D là phương pháp tạo mẫu nhanh bằng cách đắp từng lớp vật liệu kế tiếp nhau theo dữ liệu số.`,isCorrect:!0,explanation:`Đúng. In 3D (chế tạo bồi đắp - Additive Manufacturing) tạo sản phẩm bằng cách xếp chồng các lớp vật liệu 2D liên tiếp nhau.`},{id:`tf-b4-s1-q1-d`,label:`d`,text:`In 3D chỉ in được vật liệu nhựa dẻo thông thường, hoàn toàn không in được kim loại, gốm sứ hay mô sinh học.`,isCorrect:!1,explanation:`Sai. Công nghệ in 3D ngày nay in được kim loại (SLS/DMLS), hợp kim titan, gốm sứ, bê tông xây dựng và cả mô tế bào sinh học y khoa.`}]},{id:`tf-b4-s1-q2`,lessonId:`bai-4`,type:`true-false`,title:`Câu 2. Hệ thống CAD/CAM/CNC và Trí tuệ nhân tạo (AI)`,stem:`Sự tích hợp giữa phần mềm thiết kế vi tính, lập trình gia công và máy công cụ điều khiển số đã tự động hóa chu trình sản xuất cơ khí chính xác.`,explanation:`SGK Công nghệ 10 (Bài 4): Phân biệt vai trò của CAD, CAM, máy CNC và khái niệm AI.`,statements:[{id:`tf-b4-s1-q2-a`,label:`a`,text:`CAD (Computer Aided Design) là phần mềm trợ giúp thiết kế mô hình 2D và 3D của sản phẩm trên máy tính.`,isCorrect:!0,explanation:`Đúng. CAD giúp kỹ sư vẽ, thiết kế hình học và mô phỏng kết cấu cơ khí chính xác.`},{id:`tf-b4-s1-q2-b`,label:`b`,text:`CAM (Computer Aided Manufacturing) chuyển dữ liệu thiết kế CAD thành chương trình lệnh gia công (G-code) cho máy công cụ.`,isCorrect:!0,explanation:`Đúng. CAM lập kế hoạch đường chạy dao, chế độ cắt và xuất mã lệnh điều khiển máy CNC.`},{id:`tf-b4-s1-q2-c`,label:`c`,text:`Máy CNC là loại máy công cụ gia công cơ khí được điều khiển hoàn toàn bằng tay quay cơ học của thợ tiện.`,isCorrect:!1,explanation:`Sai. CNC (Computer Numerical Control) là máy công cụ được điều khiển số bằng máy tính, chuyển động tự động theo chương trình.`},{id:`tf-b4-s1-q2-d`,label:`d`,text:`Trí tuệ nhân tạo (AI) mô phỏng các quá trình học tập, suy luận và tự sửa lỗi của trí tuệ con người trên hệ thống máy tính.`,isCorrect:!0,explanation:`Đúng. AI là ngành khoa học giúp máy tính có khả năng nhận thức, học hỏi dữ liệu và đưa ra quyết định thông minh.`}]}]},{lessonId:`bai-4`,setIndex:2,title:`Bài 4 - Bộ 2: Năng lượng tái tạo, IoT và Robot thông minh`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-b4-s2-q1`,lessonId:`bai-4`,type:`true-false`,title:`Câu 1. Năng lượng tái tạo và phát triển bền vững`,stem:`Để ứng phó với biến đổi khí hậu và cạn kiệt tài nguyên nhiên liệu hóa thạch, nhân loại đang tích cực chuyển dịch sang công nghệ năng lượng tái tạo sạch.`,explanation:`SGK Công nghệ 10 (Bài 4): Các nguồn năng lượng tái tạo: gió, mặt trời, địa nhiệt, thủy triều, sinh khối.`,statements:[{id:`tf-b4-s2-q1-a`,label:`a`,text:`Năng lượng mặt trời, năng lượng gió và địa nhiệt là những nguồn năng lượng tái tạo vô tận và thân thiện với môi trường.`,isCorrect:!0,explanation:`Đúng. Các nguồn năng lượng này tự tái sinh liên tục từ tự nhiên và phát thải khí nhà kính cực thấp.`},{id:`tf-b4-s2-q1-b`,label:`b`,text:`Than đá và dầu mỏ thuộc nhóm năng lượng tái tạo vì có thể hình thành lại nhanh chóng trong vòng 1-2 năm.`,isCorrect:!1,explanation:`Sai. Than đá và dầu mỏ là nhiên liệu hóa thạch không tái tạo, cần hàng triệu năm mới hình thành và đang cạn kiệt.`},{id:`tf-b4-s2-q1-c`,label:`c`,text:`Pin quang điện (Solar cells) biến đổi trực tiếp quang năng của ánh sáng mặt trời thành điện năng nhờ hiệu ứng quang điện.`,isCorrect:!0,explanation:`Đúng. Tấm pin mặt trời hoạt động dựa trên hiệu ứng quang điện trong chất bán dẫn silic.`},{id:`tf-b4-s2-q1-d`,label:`d`,text:`Năng lượng gió sử dụng tuabin gió để biến đổi động năng của luồng gió thành cơ năng rồi thành điện năng.`,isCorrect:!0,explanation:`Đúng. Gió làm quay cánh quạt tuabin, dẫn động máy phát điện sinh ra dòng điện.`}]},{id:`tf-b4-s2-q2`,lessonId:`bai-4`,type:`true-false`,title:`Câu 2. Internet vạn vật (IoT) và Robot thông minh`,stem:`Sự kết nối giữa các thiết bị cảm biến qua mạng Internet và khả năng tự hành của robot đang cách mạng hóa mô hình nhà máy và đô thị thông minh.`,explanation:`SGK Công nghệ 10 (Bài 4): Khái niệm IoT (Internet of Things) và ứng dụng robot thông minh.`,statements:[{id:`tf-b4-s2-q2-a`,label:`a`,text:`Internet vạn vật (IoT) là mạng lưới các thiết bị được gắn cảm biến, phần mềm để kết nối và trao đổi dữ liệu với nhau qua Internet.`,isCorrect:!0,explanation:`Đúng. IoT kết nối mọi vật thể (xe cộ, đồ gia dụng, máy móc) để chia sẻ thông tin tự động.`},{id:`tf-b4-s2-q2-b`,label:`b`,text:`Robot thông minh có khả năng cảm nhận môi trường xung quanh, tự định vị và tự động ra quyết định hành động phù hợp.`,isCorrect:!0,explanation:`Đúng. Nhờ tích hợp cảm biến (LIDAR, camera) và thuật toán AI, robot thông minh có khả năng tự thích ứng và làm việc tự chủ.`},{id:`tf-b4-s2-q2-c`,label:`c`,text:`Trong nông nghiệp thông minh, hệ thống cảm biến IoT độ ẩm đất không thể tự động điều khiển van tưới nước từ xa.`,isCorrect:!1,explanation:`Sai. IoT cho phép cảm biến độ ẩm tự động kích hoạt máy bơm hoặc cho phép nông dân điều khiển tưới nước qua điện thoại thông minh.`},{id:`tf-b4-s2-q2-d`,label:`d`,text:`Robot thông minh có thể làm việc liên tục trong các môi trường nguy hiểm, độc hại mà con người khó tiếp cận.`,isCorrect:!0,explanation:`Đúng. Robot được sử dụng rộng rãi trong hàn kín buồng sơn độc hại, thăm dò đáy biển, lò phản ứng hạt nhân.`}]}]},{lessonId:`bai-6`,setIndex:1,title:`Bài 6 - Bộ 1: Tiến trình CMCN 1.0 và CMCN 2.0`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-b6-s1-q1`,lessonId:`bai-6`,type:`true-false`,title:`Câu 1. Cách mạng công nghiệp lần thứ nhất (CMCN 1.0)`,stem:`Cuộc cách mạng công nghiệp lần thứ nhất khởi phát tại nước Anh vào nửa cuối thế kỷ XVIII, mở đầu cho kỷ nguyên cơ giới hóa trong lịch sử văn minh nhân loại.`,explanation:`SGK Công nghệ 10 (Bài 6): Khởi điểm, thành tựu then chốt (máy hơi nước James Watt) và tác động của CMCN 1.0.`,statements:[{id:`tf-b6-s1-q1-a`,label:`a`,text:`CMCN 1.0 bắt đầu từ ngành công nghiệp dệt vải ở nước Anh vào nửa cuối thế kỷ XVIII.`,isCorrect:!0,explanation:`Đúng. CMCN 1.0 bắt nguồn từ ngành dệt may nước Anh với các phát minh như thoi bay của John Kay, máy kéo sợi Jenny.`},{id:`tf-b6-s1-q1-b`,label:`b`,text:`Động cơ hơi nước do James Watt cải tiến (năm 1784) là động lực cơ bắp đầu tiên thay thế hoàn toàn sức người và sức kéo động vật.`,isCorrect:!0,explanation:`Đúng. Động cơ hơi nước của James Watt cung cấp nguồn động lực cơ giới vạn năng không phụ thuộc vào địa hình hay nguồn nước.`},{id:`tf-b6-s1-q1-c`,label:`c`,text:`Thành tựu chính của CMCN 1.0 là sự xuất hiện của mạng máy tính toàn cầu Internet và trí tuệ nhân tạo.`,isCorrect:!1,explanation:`Sai. Internet xuất hiện trong CMCN 3.0 và AI phát triển mạnh trong CMCN 4.0; thành tựu then chốt của CMCN 1.0 là cơ giới hóa và động cơ hơi nước.`},{id:`tf-b6-s1-q1-d`,label:`d`,text:`CMCN 1.0 đã thúc đẩy sự ra đời của ngành luyện kim than đá và giao thông vận tải đường sắt bằng đầu máy xe lửa hơi nước.`,isCorrect:!0,explanation:`Đúng. Động cơ hơi nước dẫn đến sự bùng nổ của tàu hỏa hơi nước Stephenson (1814) và tàu thủy hơi nước.`}]},{id:`tf-b6-s1-q2`,lessonId:`bai-6`,type:`true-false`,title:`Câu 2. Cách mạng công nghiệp lần thứ hai (CMCN 2.0)`,stem:`Bắt đầu từ nửa cuối thế kỷ XIX đến đầu thế kỷ XX, CMCN 2.0 đã chuyển nền sản xuất sang kỷ nguyên điện khí hóa và dây chuyền sản xuất hàng loạt quy mô lớn.`,explanation:`SGK Công nghệ 10 (Bài 6): Đặc trưng điện năng, động cơ đốt trong và dây chuyền lắp ráp hàng loạt của CMCN 2.0.`,statements:[{id:`tf-b6-s1-q2-a`,label:`a`,text:`Đặc trưng cốt lõi của CMCN 2.0 là việc ứng dụng năng lượng điện và động cơ đốt trong vào sản xuất.`,isCorrect:!0,explanation:`Đúng. Năng lượng điện và động cơ đốt trong là hai động lực công nghệ trung tâm của CMCN 2.0.`},{id:`tf-b6-s1-q2-b`,label:`b`,text:`Dây chuyền lắp ráp hàng loạt do Henry Ford áp dụng trong chế tạo ô tô đã giúp hạ giá thành và nâng cao năng suất đột biến.`,isCorrect:!0,explanation:`Đúng. Phương pháp phân công lao động chuyên môn hóa trên băng chuyền động của Ford là biểu tượng sản xuất hàng loạt của CMCN 2.0.`},{id:`tf-b6-s1-q2-c`,label:`c`,text:`Điện thoại của Alexander Graham Bell và bóng đèn sợi đốt của Thomas Edison là những phát minh tiêu biểu trong thời kỳ CMCN 2.0.`,isCorrect:!0,explanation:`Đúng. Các phát minh này ra đời vào những thập niên cuối thế kỷ XIX, thuộc CMCN 2.0.`},{id:`tf-b6-s1-q2-d`,label:`d`,text:`CMCN 2.0 làm nền sản xuất thủ công phân tán phát triển hơn so với các nhà máy sản xuất tập trung quy mô lớn.`,isCorrect:!1,explanation:`Sai. CMCN 2.0 biến nền sản xuất thành các tập đoàn công nghiệp, nhà máy khổng lồ sản xuất hàng loạt.`}]}]},{lessonId:`bai-6`,setIndex:2,title:`Bài 6 - Bộ 2: Tiến trình CMCN 3.0 và CMCN 4.0`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-b6-s2-q1`,lessonId:`bai-6`,type:`true-false`,title:`Câu 1. Cách mạng công nghiệp lần thứ ba (CMCN 3.0)`,stem:`Bắt đầu từ những năm 70 của thế kỷ XX, cuộc cách mạng công nghiệp lần thứ ba được thúc đẩy bởi sự bùng nổ của máy tính điện tử, mạch bán dẫn và tự động hóa.`,explanation:`SGK Công nghệ 10 (Bài 6): Vai trò của bóng bán dẫn, máy tính cá nhân, mạng Internet và tự động hóa trong CMCN 3.0.`,statements:[{id:`tf-b6-s2-q1-a`,label:`a`,text:`CMCN 3.0 còn được gọi là cuộc cách mạng số hoặc cách mạng máy tính và tự động hóa.`,isCorrect:!0,explanation:`Đúng. CMCN 3.0 đánh dấu sự chuyển đổi từ công nghệ cơ khí tương tự sang công nghệ kỹ thuật số.`},{id:`tf-b6-s2-q1-b`,label:`b`,text:`Sự ra đời của bóng bán dẫn và mạch tích hợp (vi xử lý) là bệ phóng quan trọng cho máy tính cá nhân trong CMCN 3.0.`,isCorrect:!0,explanation:`Đúng. Bóng bán dẫn thay thế bóng đèn chân không cồng kềnh, giúp máy tính nhỏ gọn, mạnh mẽ và phổ cập.`},{id:`tf-b6-s2-q1-c`,label:`c`,text:`Mạng toàn cầu Internet kết nối hàng triệu máy tính trên thế giới được hình thành và phổ biến trong thời kỳ CMCN 3.0.`,isCorrect:!0,explanation:`Đúng. Internet ra đời và phát triển mạnh mẽ vào cuối thế kỷ XX, làm phẳng thế giới thông tin.`},{id:`tf-b6-s2-q1-d`,label:`d`,text:`Trong CMCN 3.0, dây chuyền sản xuất tự động sử dụng bộ điều khiển logic khả trình (PLC) hoàn toàn không xuất hiện.`,isCorrect:!1,explanation:`Sai. Bộ điều khiển lập trình PLC và robot công nghiệp xuất hiện và được ứng dụng rất rộng rãi trong CMCN 3.0 để tự động hóa dây chuyền.`}]},{id:`tf-b6-s2-q2`,lessonId:`bai-6`,type:`true-false`,title:`Câu 2. Cách mạng công nghiệp lần thứ tư (CMCN 4.0)`,stem:`Được khởi xướng từ Hội chợ triển lãm Hannover (Đức) năm 2011, CMCN 4.0 tích hợp thông minh giữa hệ thống thế giới thực và không gian ảo (Cyber-Physical Systems).`,explanation:`SGK Công nghệ 10 (Bài 6): Khái niệm nhà máy thông minh, công nghệ cốt lõi (AI, Big Data, Cloud, IoT, In 3D) của CMCN 4.0.`,statements:[{id:`tf-b6-s2-q2-a`,label:`a`,text:`CMCN 4.0 dựa trên nền tảng của sự kết hợp công nghệ trong các lĩnh vực vật lý, kỹ thuật số và sinh học.`,isCorrect:!0,explanation:`Đúng. Đây là đặc điểm nổi bật nhất của CMCN 4.0: sự xóa nhòa ranh giới giữa thế giới thực, thế giới số và sinh học.`},{id:`tf-b6-s2-q2-b`,label:`b`,text:`Hệ thống thực - ảo (CPS) và Nhà máy thông minh (Smart Factory) là trụ cột sản xuất trung tâm của CMCN 4.0.`,isCorrect:!0,explanation:`Đúng. Nhà máy thông minh liên tục theo dõi, mô phỏng quá trình sản xuất thực tế trên không gian số để tối ưu hóa tự động.`},{id:`tf-b6-s2-q2-c`,label:`c`,text:`Dữ liệu lớn (Big Data) và Điện toán đám mây (Cloud Computing) không có vai trò gì trong việc lưu trữ và phân tích dữ liệu CMCN 4.0.`,isCorrect:!1,explanation:`Sai. Big Data và Cloud là hạ tầng cốt lõi giúp xử lý khối lượng dữ liệu khổng lồ theo thời gian thực cho các thuật toán AI.`},{id:`tf-b6-s2-q2-d`,label:`d`,text:`CMCN 4.0 đòi hỏi người lao động phải không ngừng nâng cao kỹ năng số, tư duy sáng tạo và khả năng thích ứng công nghệ mới.`,isCorrect:!0,explanation:`Đúng. Tự động hóa và AI thay thế các công việc lặp đi lặp lại, đòi hỏi nhân lực chất lượng cao về công nghệ số.`}]}]},{lessonId:`tong-hop`,setIndex:1,title:`Tổng hợp - Bộ 1: Công nghệ Chế tạo & Bước chuyển Cách mạng`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-th-s1-q1`,lessonId:`tong-hop`,type:`true-false`,title:`Câu 1. Mối liên hệ giữa công nghệ gia công truyền thống và công nghệ mới`,stem:`Sự tiến hóa từ các phương pháp gia công cơ khí bóc tách phoi truyền thống sang công nghệ gia công số và công nghệ bồi đắp đã làm thay đổi căn bản nền công nghiệp chế tạo.`,explanation:`SGK Công nghệ 10 (Bài 3 & Bài 4): So sánh gia công cắt gọt truyền thống, máy CNC và công nghệ in 3D.`,statements:[{id:`tf-th-s1-q1-a`,label:`a`,text:`Gia công cắt gọt truyền thống (tiện, phay) loại bỏ phoi kim loại thừa, trong khi in 3D lại tạo hình bằng cách đắp từng lớp vật liệu.`,isCorrect:!0,explanation:`Đúng. Gia công cắt gọt là phương pháp trừ (subtractive manufacturing), còn in 3D là phương pháp cộng/bồi đắp (additive manufacturing).`},{id:`tf-th-s1-q1-b`,label:`b`,text:`Máy tiện CNC kết hợp công nghệ cắt gọt truyền thống với điều khiển tự động hóa máy tính số hiện đại.`,isCorrect:!0,explanation:`Đúng. Máy tiện CNC tự động hóa quy trình cắt gọt với độ chính xác và năng suất vượt trội so với máy cơ thông thường.`},{id:`tf-th-s1-q1-c`,label:`c`,text:`Quy trình sản xuất hiện đại chuẩn hóa là: Thiết kế mô hình CAD → Lập trình đường chạy dao CAM → Gia công trên máy CNC.`,isCorrect:!0,explanation:`Đúng. Đây là chuỗi liên kết khép kín CAD/CAM/CNC trong công nghiệp cơ khí chính xác.`},{id:`tf-th-s1-q1-d`,label:`d`,text:`Công nghệ nano chỉ ứng dụng trong y học, không thể ứng dụng để cải tiến độ cứng và độ bền của dụng cụ cắt gọt kim loại.`,isCorrect:!1,explanation:`Sai. Lớp phủ nano (như TiAlN nano) trên bề mặt dao tiện, dao phay giúp tăng độ cứng, chịu nhiệt độ cao và tăng tuổi thọ dao cắt.`}]},{id:`tf-th-s1-q2`,lessonId:`tong-hop`,type:`true-false`,title:`Câu 2. Tiến trình các cuộc cách mạng công nghiệp qua 4 giai đoạn`,stem:`Mỗi cuộc cách mạng công nghiệp đều gắn liền với một bước nhảy vọt về nguồn năng lượng và phương thức sản xuất then chốt làm biến đổi xã hội loài người.`,explanation:`SGK Công nghệ 10 (Bài 6): Dòng thời gian, thành tựu trung tâm và nguồn năng lượng của 4 cuộc CMCN.`,statements:[{id:`tf-th-s1-q2-a`,label:`a`,text:`Nguồn động lực chính của CMCN 1.0 là động cơ hơi nước; của CMCN 2.0 là động cơ điện và động cơ đốt trong.`,isCorrect:!0,explanation:`Đúng. Động cơ hơi nước mở ra thời đại cơ giới 1.0, còn điện năng và động cơ đốt trong mở ra thời đại sản xuất dây chuyền hàng loạt 2.0.`},{id:`tf-th-s1-q2-b`,label:`b`,text:`CMCN 3.0 bắt đầu từ thế kỷ XVIII với việc phát minh ra máy tính cá nhân và mạng xã hội.`,isCorrect:!1,explanation:`Sai. Thế kỷ XVIII là thời kỳ của CMCN 1.0; CMCN 3.0 bắt đầu từ những năm 70 của thế kỷ XX.`},{id:`tf-th-s1-q2-c`,label:`c`,text:`CMCN 4.0 là sự tích hợp thông minh của AI, Internet vạn vật (IoT), Dữ liệu lớn và hệ thống thực - ảo.`,isCorrect:!0,explanation:`Đúng. Đây là các công nghệ nền tảng cốt lõi định hình cuộc CMCN 4.0 hiện nay.`},{id:`tf-th-s1-q2-d`,label:`d`,text:`Cả 4 cuộc cách mạng công nghiệp đều giúp giải phóng sức lao động thủ công của con người và thúc đẩy tăng trưởng kinh tế.`,isCorrect:!0,explanation:`Đúng. Mỗi cuộc cách mạng đều nâng cao vượt bậc năng suất lao động xã hội và chất lượng cuộc sống con người.`}]}]},{lessonId:`tong-hop`,setIndex:2,title:`Tổng hợp - Bộ 2: Điện năng, Công nghệ số và Năng lượng sạch`,description:`Trắc nghiệm Đúng - Sai theo cấu trúc đề thi tốt nghiệp THPT: 2 câu × 4 lệnh hỏi a, b, c, d.`,questions:[{id:`tf-th-s2-q1`,lessonId:`tong-hop`,type:`true-false`,title:`Câu 1. Năng lượng điện và chuyển dịch năng lượng tái tạo`,stem:`Ngành điện lực đang chứng kiến sự chuyển dịch mang tính lịch sử từ các nhà máy nhiệt điện hóa thạch sang hệ thống lưới điện thông minh tích hợp năng lượng tái tạo.`,explanation:`SGK Công nghệ 10 (Bài 3 & Bài 4): Nguồn phát điện truyền thống và nguồn phát điện tái tạo sạch.`,statements:[{id:`tf-th-s2-q1-a`,label:`a`,text:`Nhiệt điện than và nhiệt điện khí xả thải lượng lớn khí CO2 gây hiệu ứng nhà kính và ô nhiễm không khí.`,isCorrect:!0,explanation:`Đúng. Đốt cháy nhiên liệu hóa thạch là nguyên nhân hàng đầu gây phát thải khí nhà kính và biến đổi khí hậu toàn cầu.`},{id:`tf-th-s2-q1-b`,label:`b`,text:`Điện mặt trời và điện gió là nguồn năng lượng tái tạo không phát thải khí nhà kính trong quá trình phát điện.`,isCorrect:!0,explanation:`Đúng. Quá trình vận hành pin mặt trời và cánh quạt gió hoàn toàn không đốt nhiên liệu và không phát sinh khí thải độc hại.`},{id:`tf-th-s2-q1-c`,label:`c`,text:`Công nghệ truyền thông không dây và IoT có thể được ứng dụng để giám sát các trạm điện mặt trời từ xa theo thời gian thực.`,isCorrect:!0,explanation:`Đúng. Các cảm biến IoT và sóng không dây truyền thông số điện áp, công suất về trung tâm điều độ tự động.`},{id:`tf-th-s2-q1-d`,label:`d`,text:`Sử dụng đèn sợi đốt thay thế cho đèn LED là giải pháp tiết kiệm năng lượng tối ưu nhất hiện nay.`,isCorrect:!1,explanation:`Sai. Đèn sợi đốt biến phần lớn điện năng thành nhiệt năng (chỉ ~5% thành ánh sáng), trong khi đèn LED tiết kiệm đến 80% điện năng và tuổi thọ gấp hàng chục lần.`}]},{id:`tf-th-s2-q2`,lessonId:`tong-hop`,type:`true-false`,title:`Câu 2. Tự động hóa sản xuất từ CMCN 3.0 đến CMCN 4.0`,stem:`Quá trình tự động hóa đã phát triển từ các cánh tay robot công nghiệp đơn lẻ sang hệ thống robot thông minh kết nối mạng trong nhà máy thông minh.`,explanation:`SGK Công nghệ 10 (Bài 3, 4, 6): Tiến trình tự động hóa điều khiển từ PLC đến AI và CPS.`,statements:[{id:`tf-th-s2-q2-a`,label:`a`,text:`Trong CMCN 3.0, robot công nghiệp thực hiện các thao tác cơ học lặp đi lặp lại theo chương trình cứng lập sẵn.`,isCorrect:!0,explanation:`Đúng. Robot thế hệ 3.0 hoạt động chính xác theo quỹ đạo cố định nhưng chưa có khả năng tự nhận thức linh hoạt.`},{id:`tf-th-s2-q2-b`,label:`b`,text:`Trong CMCN 4.0, robot thông minh tích hợp AI và thị giác máy tính có thể nhận biết vật cản và cộng tác an toàn với con người.`,isCorrect:!0,explanation:`Đúng. Robot cộng tác (Cobot) sử dụng cảm biến và AI để phối hợp linh hoạt cùng công nhân mà không gây nguy hiểm.`},{id:`tf-th-s2-q2-c`,label:`c`,text:`Công nghệ điều khiển tự động hóa hoàn toàn không cần dùng đến cảm biến (sensor) để thu thập thông tin.`,isCorrect:!1,explanation:`Sai. Cảm biến là giác quan bắt buộc phải có để thu nhận tín hiệu đầu vào (nhiệt độ, áp suất, khoảng cách) truyền về bộ điều khiển.`},{id:`tf-th-s2-q2-d`,label:`d`,text:`Chuyển đổi số và CMCN 4.0 mở ra nhiều cơ hội nghề nghiệp mới trong lĩnh vực thiết kế và công nghệ cho học sinh.`,isCorrect:!0,explanation:`Đúng. Nhu cầu nhân lực về lập trình viên IoT, kỹ sư AI, vận hành máy CNC và thiết kế sản phẩm 3D ngày càng tăng cao.`}]}]}];function w(e,t=1){let n=ee.filter(t=>t.lessonId===e);return n[t-1]||n[0]||ee[0]}var te=[{id:`bai-3`,title:`Bài 3: 10 công nghệ phổ biến`,subtitle:`Lĩnh vực Luyện kim, Cơ khí & Điện - Điện tử`,badge:`Bài 3`,color:`from-amber-500 to-orange-600`,description:`Nắm vững bản chất, nguyên lý và sản phẩm của 10 công nghệ cốt lõi trong đời sống và sản xuất công nghiệp.`},{id:`bai-4`,title:`Bài 4: Một số công nghệ mới`,subtitle:`7 Công nghệ tiên phong thời đại mới`,badge:`Bài 4`,color:`from-cyan-500 to-blue-600`,description:`Khám phá công nghệ Nano, CAD/CAM/CNC, In 3D, Năng lượng tái tạo, Trí tuệ nhân tạo (AI), IoT và Robot thông minh.`},{id:`bai-6`,title:`Bài 6: Các cuộc cách mạng công nghiệp`,subtitle:`4 Cuộc cách mạng làm thay đổi văn minh nhân loại`,badge:`Bài 6`,color:`from-purple-500 to-indigo-600`,description:`Tìm hiểu bối cảnh, thành tựu, vai trò và đặc trưng của 4 cuộc cách mạng công nghiệp từ thế kỉ XVIII đến nay.`},{id:`tong-hop`,title:`Tổng hợp bài 3, bài 4, bài 6`,subtitle:`Ôn tập toàn diện chuẩn kiến thức SGK`,badge:`Tổng hợp`,color:`from-emerald-500 to-teal-600`,description:`Thử thách liên bài kết hợp các kiến thức cơ khí, điện tử, công nghệ mới và tiến trình phát triển công nghiệp.`}],T=[{id:`matching`,name:`Ghép đôi hình ảnh`,english:`Image / Concept Matching`,icon:`Layers`,color:`border-blue-500 text-blue-400 bg-blue-500/10`,description:`Nối các thuật ngữ công nghệ với đặc điểm, sản phẩm hoặc hình ảnh tương ứng.`},{id:`drag-drop`,name:`Kéo thả tương tác`,english:`Interactive Drag & Drop`,icon:`Move`,color:`border-emerald-500 text-emerald-400 bg-emerald-500/10`,description:`Kéo nhãn công nghệ vào đúng ô định nghĩa, bản chất kỹ thuật hoặc sơ đồ sản xuất.`},{id:`ordering`,name:`Sắp xếp trình tự`,english:`Chronology & Steps`,icon:`ArrowDownUp`,color:`border-purple-500 text-purple-400 bg-purple-500/10`,description:`Sắp xếp đúng quy trình công nghệ kỹ thuật hoặc dòng thời gian các phát minh lịch sử.`},{id:`engineer`,name:`Nhà kĩ sư tương lai`,english:`Future Engineer Scenarios`,icon:`Wrench`,color:`border-rose-500 text-rose-400 bg-rose-500/10`,description:`Hóa thân thành kỹ sư chuyên môn giải quyết bài toán kỹ thuật thực tế với trợ giúp từ AI.`},{id:`true-false`,name:`Trắc nghiệm Đúng - sai`,english:`True / False Exam Format`,icon:`CheckSquare`,color:`border-emerald-500 text-emerald-400 bg-emerald-500/10`,description:`Cấu trúc đề thi THPT: 2 câu × 4 lệnh hỏi a, b, c, d. Chọn Đúng hoặc Sai cho mỗi nhận định.`}];function ne(e){let t=[...e];for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t}function re(e,t=1){let n=y.filter(t=>t.lessonId===e);return n[t-1]||n[0]}function ie(e,t=1){let n=b.filter(t=>t.lessonId===e);return n[t-1]||n[0]}function ae(e,t=1){let n=x.filter(t=>t.lessonId===e);return n[t-1]||n[0]}function oe(e,t=1){let n=S.filter(t=>t.lessonId===e);return n[t-1]||n[0]}function se(e,t=1){let n=C.filter(t=>t.lessonId===e);if(n.length<=1)return n;let r=Math.ceil(n.length/2);return t===1?n.slice(0,r):n.slice(r)}var ce=`16bPIYS-Wbffwjef2b-bcj2SPiqz_eepsWnDlID7bUrY`,le=`https://script.google.com/macros/s/AKfycbxCQDHbX_Iq8A11yKhekUIibCS1DHiygOZZhrtZNvlv2CXkVSGggcsF9IsUh2AiJ-NQ/exec`,ue=`/**

/**

function doPost(e) {

  try {

    var studentName = data["Họ Và Tên"] || payload["Họ Và Tên"] || data["Họ và Tên"] || payload["Họ và Tên"] || data["Họ tên"] || payload["Họ tên"] || data.studentName || payload.studentName || data.hoVaTen || payload.hoVaTen || data.name || "";
    var className = data["Lớp"] || payload["Lớp"] || data["Lop"] || payload["Lop"] || data.className || payload.className || data.lop || payload.lop || "";
    var lessonTitle = data["Bài Học"] || payload["Bài Học"] || data["Bài học"] || payload["Bài học"] || data["Bai Hoc"] || payload["Bai Hoc"] || data.lessonTitle || payload.lessonTitle || data.baiHoc || payload.baiHoc || data.lessonId || payload.lessonId || "";
    var gameModeTitle = data["Trò Chơi"] || payload["Trò Chơi"] || data["Trò chơi"] || payload["Trò chơi"] || data["Tro Choi"] || payload["Tro Choi"] || data.gameModeTitle || payload.gameModeTitle || data.troChoi || payload.troChoi || data.gameMode || payload.gameMode || "";

    if (action === "SAVE_INITIAL_SCORE") {
      // 1. Lưu lượt chơi chính mới từ hàng 4
      var newRowIndex = findNextAvailableRow(resultSheet, START_ROW);
      
      var rowValues = [
        data.timestamp || payload.timestamp || Utilities.formatDate(new Date(), "GMT+7", "dd/MM/yyyy HH:mm:ss"), // Cột A (1): Thời gian
        data.sessionId || payload.sessionId || ("SES-" + new Date().getTime()),                                 // Cột B (2): Mã lượt chơi
        studentId,                                                                                             // Cột C (3): Mã HS (STT)
        studentName,                                                                                           // Cột D (4): Họ Và Tên
        className,                                                                                             // Cột E (5): Lớp
        lessonTitle,                                                                                           // Cột F (6): Bài Học
        gameModeTitle,                                                                                         // Cột G (7): Trò Chơi
        (data.setIndex || payload.setIndex) ? ("Bộ " + (data.setIndex || payload.setIndex)) : "Bộ 1",          // Cột H (8): Bộ câu hỏi
        data.score !== undefined ? data.score : (payload.score || 0),                                         // Cột I (9): Điểm số lần đầu
        data.totalQuestions !== undefined ? data.totalQuestions : (payload.totalQuestions || 0),              // Cột J (10): Tổng số câu
        data.correctCount !== undefined ? data.correctCount : (payload.correctCount || 0),                    // Cột K (11): Số câu đúng
        data.wrongCount !== undefined ? data.wrongCount : (payload.wrongCount || 0),                          // Cột L (12): Số câu sai
        "",                                                                                                   // Cột M (13): Điểm sau ôn lại
        "",                                                                                                   // Cột N (14): Số câu đúng sau ôn
        "",                                                                                                   // Cột O (15): Thời gian ôn lại
        "Hoàn thành lần đầu"                                                                                  // Cột P (16): Trạng thái
      ];

      resultSheet.getRange(newRowIndex, 1, 1, rowValues.length).setValues([rowValues]);

      // Định dạng dòng vừa ghi
      resultSheet.getRange(newRowIndex, 1, 1, rowValues.length)
        .setFontFamily("Arial")
        .setFontSize(10)
        .setVerticalAlignment("middle");
      resultSheet.getRange(newRowIndex, 1, 1, 8).setHorizontalAlignment("left");
      resultSheet.getRange(newRowIndex, 9, 1, 7).setHorizontalAlignment("center");

      // Cập nhật thống kê tự động
      updateStatsSheet(ss);

        action: "SAVE_INITIAL_SCORE",

        sessionId: data.sessionId || payload.sessionId,
        studentId: studentId,

        className: className,

    } else if (action === "UPDATE_REVIEW_SCORE") {

      var targetSessionId = data.sessionId || payload.sessionId;

      if (foundRow > 0) {

        // Cột N (14): Số câu đúng sau ôn
        // Cột O (15): Thời gian ôn lại
        resultSheet.getRange(foundRow, 13, 1, 3).setValues([[
          reviewScore,
          reviewCorrect,
          reviewTime
        ]]);

        // Cập nhật 5 nội dung vào Cột C–G nếu trước đó còn trống
        if (studentId) resultSheet.getRange(foundRow, 3).setValue(studentId);
        if (studentName) resultSheet.getRange(foundRow, 4).setValue(studentName);
        if (className) resultSheet.getRange(foundRow, 5).setValue(className);

        updateStatsSheet(ss);

        responseData = {
          success: true,
          action: "UPDATE_REVIEW_SCORE",
          row: foundRow,
          sessionId: targetSessionId,
          studentId: studentId,
          studentName: studentName,
          className: className,
          lessonTitle: lessonTitle,
          gameModeTitle: gameModeTitle,

        // Dự phòng an toàn: nếu không tìm thấy dòng cũ, ghi dòng mới từ hàng 4 với đủ 5 nội dung

          gameModeTitle,
          "Bộ 1",

          reviewCorrect,
          0,

          reviewCorrect,
          reviewTime,
          "Đã ôn lại câu sai"
        ];
        resultSheet.getRange(newRow, 1, 1, fallbackValues.length).setValues([fallbackValues]);
        updateStatsSheet(ss);

        responseData = {
          success: true,
          action: "UPDATE_REVIEW_SCORE",
          row: newRow,
          sessionId: targetSessionId,
          message: "Đã lưu kết quả ôn lại vào hàng mới " + newRow + " kèm đủ 5 nội dung"
        };
      }
    } else {
      responseData = { success: false, error: "Hành động không hợp lệ" };
    }

    return ContentService

  } catch (error) {
    return ContentService

  } finally {
    lock.releaseLock();
  }
}

/**
 * Tìm dòng còn trống tiếp theo từ hàng START_ROW (hàng 4)
 */
function findNextAvailableRow(sheet, startRow) {
  var lastRow = sheet.getLastRow();
  if (lastRow < startRow) {
    return startRow;
  }
  // Quét cột B (Mã Lượt Chơi) để tìm ô trống đầu tiên
  var values = sheet.getRange(startRow, 2, (lastRow - startRow + 1) || 1, 1).getValues();
  for (var i = 0; i < values.length; i++) {
    if (!values[i][0] || values[i][0].toString().trim() === "") {
      return startRow + i;
    }
  }
  return lastRow + 1;
}

/**
 * Dò tìm dòng có Mã lượt chơi (Cột B) khớp với targetSessionId
 */
function findRowBySessionId(sheet, targetSessionId, startRow) {
  var lastRow = sheet.getLastRow();
  if (lastRow < startRow) return -1;
  var data = sheet.getRange(startRow, 2, lastRow - startRow + 1, 1).getValues();
  for (var i = 0; i < data.length; i++) {
    if (data[i][0] && data[i][0].toString().trim() === targetSessionId.toString().trim()) {
      return startRow + i;
    }
  }
  return -1;
}

/**
 * Tự động tổng hợp và thống kê học tập vào sheet TRO_CHOI_HOC_TAP
 */
function updateStatsSheet(ss) {
  var resultsSheet = ss.getSheetByName(SHEET_RESULTS);
  if (!resultsSheet) return;

  var statsSheet = ss.getSheetByName(SHEET_STATS);
  if (!statsSheet) {
    statsSheet = ss.insertSheet(SHEET_STATS);
  }

  var lastRow = resultsSheet.getLastRow();
  if (lastRow < START_ROW) return;

  var data = resultsSheet.getRange(START_ROW, 1, lastRow - START_ROW + 1, 16).getValues();
  var studentMap = {};

  for (var i = 0; i < data.length; i++) {
    var row = data[i];
    var sessId = row[1];
    var studentId = row[2];
    var studentName = row[3];
    var className = row[4];
    var scoreInit = Number(row[8]) || 0;
    var reviewedScore = row[12] !== "" ? Number(row[12]) : null;
    var finalScore = reviewedScore !== null ? Math.max(scoreInit, reviewedScore) : scoreInit;

    if (!studentName) continue;
    var key = className + "_" + studentId + "_" + studentName;

    if (!studentMap[key]) {
      studentMap[key] = {
        className: className,
        studentId: studentId,
        studentName: studentName,
        totalGames: 0,
        totalScore: 0,
        maxScore: 0,
        reviewedCount: 0,
        lastPlay: row[0]
      };
    }

    studentMap[key].totalGames += 1;
    studentMap[key].totalScore += finalScore;
    if (finalScore > studentMap[key].maxScore) {
      studentMap[key].maxScore = finalScore;
    }
    if (reviewedScore !== null) {
      studentMap[key].reviewedCount += 1;
    }
    studentMap[key].lastPlay = row[0];
  }

  // Thiết lập tiêu đề sheet TRO_CHOI_HOC_TAP
  statsSheet.clear();
  statsSheet.getRange(1, 1).setValue("BẢNG TỔNG HỢP VÀ THỐNG KÊ HỌC TẬP - CÔNG NGHỆ 10")
    .setFontSize(14).setFontWeight("bold").setFontColor("#0d652d");
  statsSheet.getRange(2, 1).setValue("Cập nhật tự động: " + Utilities.formatDate(new Date(), "GMT+7", "dd/MM/yyyy HH:mm:ss"))
    .setFontSize(10).setFontStyle("italic").setFontColor("#5f6368");

  var statHeaders = [
    "STT",
    "Lớp",
    "Mã HS",
    "Họ Và Tên Học Sinh",
    "Số Lượt Chơi",
    "Điểm Trung Bình",
    "Điểm Cao Nhất",
    "Lượt Đã Ôn Lại",
    "Thời Gian Chơi Gần Nhất",
    "Đánh Giá Rèn Luyện"
  ];

  statsSheet.getRange(3, 1, 1, statHeaders.length)
    .setValues([statHeaders])
    .setBackground("#0d652d")
    .setFontColor("#ffffff")
    .setFontWeight("bold")
    .setHorizontalAlignment("center");

  var statRows = [];
  var index = 1;
  for (var k in studentMap) {
    var item = studentMap[k];
    var avgScore = item.totalGames > 0 ? (item.totalScore / item.totalGames).toFixed(1) : 0;
    var rating = "Cần cố gắng";
    if (avgScore >= 8.5) rating = "Xuất sắc ⭐";
    else if (avgScore >= 7.0) rating = "Đạt Khá tốt 👍";
    else if (avgScore >= 5.0) rating = "Đạt trung bình";

    statRows.push([
      index++,
      item.className,
      item.studentId,
      item.studentName,
      item.totalGames,
      Number(avgScore),
      item.maxScore,
      item.reviewedCount,
      item.lastPlay,
      rating
    ]);
  }

  if (statRows.length > 0) {
    statsSheet.getRange(4, 1, statRows.length, statHeaders.length).setValues(statRows);
    statsSheet.getRange(4, 1, statRows.length, statHeaders.length)
      .setFontFamily("Arial")
      .setFontSize(10)
      .setVerticalAlignment("middle");
    statsSheet.getRange(4, 1, statRows.length, 4).setHorizontalAlignment("left");
    statsSheet.getRange(4, 5, statRows.length, 6).setHorizontalAlignment("center");
  }

  statsSheet.setFrozenRows(3);
}
